<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>大泉学園無人販売所 見た目A/B</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  .page {
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: var(--fs-h2); }
  .card { background: var(--surface); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; font-size: var(--fs-h3); font-weight: 600; line-height: var(--lh-heading); }
  .card ul { margin: 0; padding-left: 20px; color: var(--text-sub); font-size: var(--fs-small); }
  .card .btn { align-self: flex-start; }
</style>
</head>
<body>
<main class="page">
  <h1>ファミコン風の見た目 A/B</h1>
  <p class="sub">中身は今のページと同じです。見た目だけを変えています。動いているときの自キャラの足踏みは、現在地を出して歩くと見られます。</p>
  <section class="card">
    <h2>A RPG風</h2>
    <ul>
      <li>黒いウィンドウに白い枠。コマンドは「▶」で選ぶ</li>
      <li>地図は草原のような明るい緑と砂色の道</li>
      <li>近づくと「はんばいじょを みつけた！」</li>
    </ul>
    <a class="btn btn-primary" href="./?theme=rpg">A を開く</a>
  </section>
  <section class="card">
    <h2>B ファミコン本体風</h2>
    <ul>
      <li>えんじ色とクリーム色、金色の線。本体の配色がモチーフ</li>
      <li>地図はやわらかい生成り色で、今の地図に近い読みやすさ</li>
      <li>近づくと「ちかくに あるよ！」</li>
    </ul>
    <a class="btn btn-primary" href="./?theme=fami">B を開く</a>
  </section>
  <section class="card">
    <h2>今の見た目</h2>
    <a class="btn btn-secondary" href="./">今のページを開く</a>
  </section>
</main>
</body>
</html>
