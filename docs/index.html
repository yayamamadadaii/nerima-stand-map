<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ねりま無人販売所マップ 試作</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  .page {
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: var(--fs-h2); }
  .card { background: var(--surface); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; font-size: var(--fs-h3); font-weight: 600; line-height: var(--lh-heading); }
  .card p { margin: 0; }
  .card ul { margin: 0; padding-left: 20px; color: var(--text-sub); font-size: var(--fs-small); }
  .card .btn { align-self: flex-start; }
</style>
</head>
<body>
<main class="page">
  <h1>ねりま無人販売所マップ 試作 A/B</h1>
  <p class="sub">どちらも大泉5町の46か所。右下の丸ボタンは上が「向き」、下が「現在地」。</p>
  <section class="card">
    <h2>A 平らな地図（軽さ優先）</h2>
    <ul>
      <li>真上から見た地図。北が上のまま</li>
      <li>現在地を追いかけ、向いている方向を扇形で表示</li>
      <li>読み込みが軽い（地図ライブラリ 約150KB）</li>
    </ul>
    <a class="btn btn-primary" href="a/">A を開く</a>
  </section>
  <section class="card">
    <h2>B 傾く地図（ポケモンGO風）</h2>
    <ul>
      <li>現在地を追うと地図が斜めに傾き、向いている方向が上になる</li>
      <li>2本指で回転・傾きも変えられる</li>
      <li>読み込みが重め（地図ライブラリ 約800KB）。古いスマホでは動きが重くなることがある</li>
    </ul>
    <a class="btn btn-primary" href="b/">B を開く</a>
  </section>
</main>
</body>
</html>
