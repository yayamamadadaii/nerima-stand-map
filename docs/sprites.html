<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3EBDD">
<title>ピンのドット絵 候補</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 候補の見比べ用ページ（決まったら消す） */
  body { overflow: auto; background: #F4EEDC; color: #1A1A1A; }
  .page {
    max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: var(--fs-h2); color: #9E1B22; }
  h2 { margin: 8px 0 0; font-size: var(--fs-h3); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card { background: #FFFDF5; border: 3px solid #9E1B22; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card h3 { margin: 0; font-size: var(--fs-body); font-weight: 600; }
  .card p { margin: 0; font-size: var(--fs-small); color: #4A4038; }
  .stage { background: #EFE6D2; border-radius: 4px; padding: 12px; display: flex; align-items: flex-end; justify-content: space-around; min-height: 120px; }
  .stage img { image-rendering: pixelated; display: block; }
  .tag { align-self: flex-start; font-size: var(--fs-caption); font-weight: 600; padding: 2px 8px; border-radius: 2px; background: #D4A944; color: #1A1A1A; }
  .tag.now { background: #9E1B22; color: #FFFDF5; }
  .bob { animation: bob 0.6s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .hop { animation: hop 0.8s steps(1) infinite; transform-origin: 50% 100%; }
  @keyframes hop { 0% { transform: none; } 25% { transform: scale(1.1, 0.85); } 50% { transform: translateY(-8px); } 75% { transform: none; } }
  @media (max-width: 420px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .bob, .hop { animation: none; } }
</style>
</head>
<body>
<main class="page">
  <h1>ピンのドット絵 候補</h1>
  <p class="sub">左が地図に出る大きさ、右が拡大。気に入ったものを番号で教えてください（組み合わせもできます）。</p>
  <h2>無人販売所</h2>
  <div class="grid" id="unmanned"></div>
  <h2>直売所</h2>
  <div class="grid" id="manned"></div>
  <h2>品目で棚の中身を変える（無人販売所）</h2>
  <div class="grid" id="kinds"></div>
  <h2>近づいたときの動き</h2>
  <div class="grid" id="moves"></div>
</main>
<script>
const PAL = {
  K: '#3A2A1A', W: '#FFFDF5', R: '#E43B44', O: '#F7962F', Y: '#F8D040', G: '#4CAF3A', L: '#8FD45A', P: '#7A4FC8',
  B: '#6B3A1A', N: '#C98A4A', C: '#F6E7C4', S: '#FCD8A8', U: '#2F6FD8', E: '#9A9A9A', D: '#5E5E66', A: '#7FA7C9',
  I: '#CFEAF5', T: '#D9A55B', M: '#F07BB0', V: '#24396B', H: '#F8B800'
};
const S = {
  shelf: ['...KKKKKKKKKK...', '..KBBBBBBBBBBK..', '.KBBBBBBBBBBBBK.', 'KKKKKKKKKKKKKKKK', 'KNCCCCCCCCCCCCNK', 'KNCRRCOOCLLCPPNK',
    'KNKRRKOOKGGKPPNK', 'KNNNNNNNNNNNNNNK', 'KNCYYCLLCRRCEENK', 'KNKYYKGGKRRKEENK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KN..........NK.', '.KK..........KK.'],
  hut: ['.......KK.......', '......KBBK......', '.....KBBBBK.....', '....KBBBBBBK....', '...KBBBBBBBBK...', '..KBBBBBBBBBBK..', '.KKKKKKKKKKKKKK.',
    '..KNNNNNNNNNNK..', '..KNCCCCCCCCNK..', '..KNCRRCOOLLNK..', '..KNCRRCOOGGNK..', '..KNNNNNNNNNNK..', '..KNNNNNNEEENK..', '..KNNNNNNEKENK..', '..KKKKKKKKKKKK..'],
  locker: ['.KKKKKKKKKKKKKK.', '.KAAAAAAAAAAAAK.', '.KAKKKKKKKKKKAK.', '.KAKRRKOOKLLKAK.', '.KAKRRKOOKGGKAK.', '.KAKKKKKKKKKKAK.', '.KAKYYKPPKRRKAK.',
    '.KAKYYKPPKRRKAK.', '.KAKKKKKKKKKKAK.', '.KAAAAAAAAAAAAK.', '.KAAAAAAADDAAAK.', '.KAAAAAAAKDAAAK.', '.KAAAAAAAAAAAAK.', '.KKKKKKKKKKKKKK.', '..KK........KK..'],
  basket: ['....G..L........', '...KRKKOK...KKKK', '..KRRRKOOK..KWWK', '..KRWRKOOOK.KWKK', '.KLLRRKOOOGKKWWK', '.KLLLLGGGGGK.KK.', 'KKKKKKKKKKKKK.K.',
    'KTNTNTNTNTNTK.K.', 'KNTNTNTNTNTNK.K.', '.KTNTNTNTNTK..K.', '.KNTNTNTNTNK..K.', '..KKKKKKKKK..KKK'],
  tent: ['...KKKKKKKKKK...', '..KRRWWRRWWRRK..', '.KRRWWRRWWRRWWK.', 'KRRWWRRWWRRWWRRK', 'KKKKKKKKKKKKKKKK', '.K....BBBB....K.', '.K...BSSSSB...K.',
    '.K...SKSSKS...K.', '.K....SKKS....K.', '.KRR.UUUUUU.LL.K', 'KKKKKKKKKKKKKKKK', 'KNNNNNNNNNNNNNNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KK..........KK.'],
  noren: ['..KKKKKKKKKKKK..', '.KBBBBBBBBBBBBK.', 'KBBBBBBBBBBBBBBK', 'KKKKKKKKKKKKKKKK', '.KVVVKVVVKVVVVK.', '.KVWVKVWVKVWVVK.', '.KVVVKVVVKVVVVK.',
    '.K....BBBB....K.', '.K...WWWWWW...K.', '.K...SKSSKS...K.', '.KRR..SKKS..LLK.', 'KKKKKKKKKKKKKKKK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KK..........KK.'],
  house: ['......KKKK......', '....KKDDDDKK....', '..KKDDDDDDDDKK..', 'KKDDDDDDDDDDDDKK', '.KCCCCCCCCCCCCK.', '.KCKKKCCCCKKKCK.', '.KCKIKCCCCKIKCK.',
    '.KCKKKCBBBKKKCK.', '.KCCCCBSSSBCSCK.', '.KCCCCSKSKSCSCK.', '.KKKKRRSSSLLKKK.', '..KNNNNUUUNNNK..', '..KN..UUUUU.NK..', '..KK...K.K..KK..'],
  house2: ['......KKKK......', '....KKDDDDKK....', '..KKDDDDDDDDKK..', 'KKDDDDDDDDDDDDKK', '.KCCCCCCCCCCCCK.', '.KCKKKCCCCKKKSK.', '.KCKIKCCCCKIKSK.',
    '.KCKKKCBBBKKSKK.', '.KCCCCBSSSBSCCK.', '.KCCCCSKSKSCCCK.', '.KKKKRRSSSLLKKK.', '..KNNNNUUUNNNK..', '..KN..UUUUU.NK..', '..KK...K.K..KK..'],
  greenhouse: ['...KKKKKKKKKK...', '..KIIIIIIIIIIK..', '.KIIKIIIIKIIIIK.', 'KIIIKIIIIKIIIIIK', 'KIIIKIIIIKIIIIIK', 'KGLGKGLGLKGLGLGK', 'KKKKKKKKKKKKKKKK',
    '..........BBBB..', '.........BSSSSB.', '.RR.LL...SKSSKS.', 'KKKKKKK...SKKS..', 'KNNNNNK..UUUUUU.', '.K...K...UUUUUU.', '.K...K...KK..KK.'],
  fruit: ['...KKKKKKKKKK...', '..KBBBBBBBBBBK..', '.KBBBBBBBBBBBBK.', 'KKKKKKKKKKKKKKKK', 'KNCCCCCCCCCCCCNK', 'KNCPPCOOCPPCOONK',
    'KNKPPKOOKPPKOONK', 'KNNNNNNNNNNNNNNK', 'KNCOOCRRCOOCYYNK', 'KNKOOKRRKOOKYYNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KN..........NK.', '.KK..........KK.'],
  flower: ['...KKKKKKKKKK...', '..KBBBBBBBBBBK..', '.KBBBBBBBBBBBBK.', 'KKKKKKKKKKKKKKKK', 'KNCMYCCYMCCMYCNK', 'KNCGGCCGGCCGGCNK',
    'KNKTTKKTTKKTTKNK', 'KNNNNNNNNNNNNNNK', 'KNCYMCCMYCCYMCNK', 'KNCGGCCGGCCGGCNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KN..........NK.', '.KK..........KK.']
};
function src(key) {
  const rows = S[key], c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  return c.toDataURL();
}
function img(key, scale, cls) {
  const i = new Image(); i.src = src(key);
  i.style.width = S[key][0].length * scale + 'px'; i.style.height = S[key].length * scale + 'px';
  if (cls) i.className = cls;
  return i;
}
// 2コマのアニメ（家の人が手を振る）
function anim(a, b, scale) {
  const i = img(a, scale), sa = src(a), sb = src(b);
  let f = 0;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => { i.src = (f = 1 - f) ? sb : sa; }, 450);
  return i;
}
function card(where, title, note, nodes, now) {
  const c = document.createElement('section'); c.className = 'card';
  c.innerHTML = `<span class="tag${now ? ' now' : ''}"></span><h3></h3><div class="stage"></div><p></p>`;
  c.querySelector('.tag').textContent = now ? '今の絵' : '候補';
  c.querySelector('h3').textContent = title;
  c.querySelector('p').textContent = note;
  c.querySelector('.stage').append(...nodes);
  document.getElementById(where).append(c);
}
const pair = (k, cls) => [img(k, 2.25, cls), img(k, 5, cls)];
card('unmanned', '① 屋根つきの棚', '木の棚に野菜と果物が2段に並ぶ。', pair('shelf'), true);
card('unmanned', '② 小屋型スタンド', '三角屋根の小屋。右下に料金箱。「無人」らしさが伝わりやすい。', pair('hut'));
card('unmanned', '③ ロッカー型（野菜の自販機）', '扉ごとに野菜が見える。練馬に多い自販機そのもの。', pair('locker'));
card('unmanned', '④ かごと値札', '竹かごに野菜が山盛り、横に値札。小さくても形が分かりやすい。', pair('basket'));
card('manned', '⑤ しま模様のテント', 'テントの下にお店の人。', pair('tent'), true);
card('manned', '⑥ のれんの屋台', '紺ののれんと、はちまきのお店の人。ファミコンの「お店」っぽい。', pair('noren'));
card('manned', '⑦ 農家の軒先', '瓦屋根の家の前で、お店の人が手を振る（2コマのアニメ）。', [anim('house', 'house2', 2.25), anim('house', 'house2', 5)]);
card('manned', '⑧ ビニールハウスと人', 'ハウスの前に台を出して、お店の人が立つ。農家らしさが出る。', pair('greenhouse'));
card('kinds', '⑨ 果物の店', '主に果物の店は、ぶどうやみかんを並べる。', pair('fruit'));
card('kinds', '⑩ 花の店', '花や苗の店は、植木鉢の花を並べる。', pair('flower'));
card('moves', '⑪ 上下にゆれる', '今の動き。近づくとピンが小さく上下する。', [img('shelf', 2.25, 'bob'), img('tent', 2.25, 'bob')], true);
card('moves', '⑫ ぴょこっと跳ねる', '一度つぶれてから跳ねる。もう少しゲームっぽい動き。', [img('shelf', 2.25, 'hop'), img('tent', 2.25, 'hop')]);
</script>
</body>
</html>
