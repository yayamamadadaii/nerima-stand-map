<!doctype html>
<html lang="ja" class="retro t-fami">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ピンの絵・タイトルの見比べ</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&text=%E9%81%93%E3%81%AE%E3%83%9E%E3%83%AB%E3%82%B7%E3%82%A7MAP%E5%A4%A7%E6%B3%89%E5%AD%A6%E5%9C%92%E7%89%88&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&text=%E9%81%93%E3%81%AE%E3%83%9E%E3%83%AB%E3%82%B7%E3%82%A7MAP%E5%A4%A7%E6%B3%89%E5%AD%A6%E5%9C%92%E7%89%88&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E9%81%93%E3%81%AE%E3%83%9E%E3%83%AB%E3%82%B7%E3%82%A7MAP%E5%A4%A7%E6%B3%89%E5%AD%A6%E5%9C%92%E7%89%88&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&text=%E9%81%93%E3%81%AE%E3%83%9E%E3%83%AB%E3%82%B7%E3%82%A7MAP%E5%A4%A7%E6%B3%89%E5%AD%A6%E5%9C%92%E7%89%88&display=swap">
<style>
  /* 見比べ用の仮ページ（ロードマップ 1-3・1-4、2回目）。決まったら消す */
  /* 地図の画面用に style.css が止めているスクロールを、このページでは戻す */
  html, body { height: auto; overflow: auto; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }
  main { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
  h2.sec { font-size: var(--fs-h2); margin: 0; }
  .lead { margin: 4px 0 0; color: var(--text-sub); font-size: var(--fs-small); }
  .opt { background: var(--surface); border: 3px solid var(--line); border-radius: var(--radius-card); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .opt h3 { margin: 0; font-size: var(--fs-h3); }
  .note-s { color: var(--text-sub); font-size: var(--fs-small); margin: 0; }
  .ground { background: var(--map-land); border-radius: var(--radius-small); padding: 12px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .ground figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--fs-caption); color: var(--text-sub); }
  .mock-top { border-radius: var(--radius-small); overflow: hidden; }
  .mock-top .top { position: static; }
  .mock-top h1 { line-height: 1.2; }
  .mock-top h1 small { display: block; font-size: var(--fs-small); letter-spacing: 0.02em; }
</style>
</head>
<body>
<main>
  <div>
    <h2 class="sec">1. ピンの絵（果物と野菜の盛り合わせ）</h2>
    <p class="lead">カイロソフトのゲームを参考に、ふち取り・丸み・影1段・明るい色で描いた下書き。左が地図での大きさ、右が拡大。どれも無人・有人の区別はしない。</p>
  </div>
  <div id="pins"></div>
  <div>
    <h2 class="sec">2. タイトルの文字</h2>
    <p class="lead">「大泉学園版」は小さく2行目に。タイトルの文字だけ変え、本文はシステムフォントのまま。</p>
  </div>
  <div id="titles"></div>
  <p class="note-s">文字はタイトルに使う13文字だけを読み込むので、重さはほとんど増えない。</p>
</main>
<script>
  const PAL = {"K": "#4A2E2A", "R": "#F0483A", "r": "#FF9C8A", "O": "#FF9A2E", "o": "#FFD08A", "Y": "#FFD43A", "y": "#FFF0A0", "G": "#5CC84A", "g": "#2E8A3A", "L": "#A8E06A", "l": "#D8F5A8", "P": "#8A4AC8", "p": "#C09AF0", "N": "#D08A4A", "n": "#F0B878", "D": "#9A5A30", "W": "#FFFFFF", "M": "#E8487A", "m": "#FFA8C8", "q": "#C02A2A", "v": "#5A2A90", "u": "#D06A10", "t": "#78B840", "z": "#E0A800"};
  const SPRITES = {"crate": ["........................", "...K.....KK....KK.......", "..KLK...KGK...KYYK......", "..KLGK.KGGK...KYYK....G.", "...KGGKKGGK..KYYYK.KKg..", "...KGGKKGGK..KYYYKKPPPK.", "...KGKKKGGKKgGKYYKPPPPK.", "...KKlLLKKrrGRRKYKPPPPK.", "...KlLLLLKrWRRRKKPPPPK..", "..KlLLLLKrRRRRRRKPKgKK..", "..KLLLGLKRRRRRRqKKOOOK..", "..KLLGLGLKRRRRqKKOOOOOK.", "...KLLLLtKRRRqqKKOOOOOK.", "...KKLLtKKKKKKK..KOOOK..", ".KKKKKKKKKKKKKKKKKKKKKK.", ".KnnnnnnnnnnnnnnnnnnnnK.", ".KNNNNNDNNNNDNNNNDNNNNK.", ".KDDDDDDDDDDDDDDDDDDDDK.", ".KNNNNNDNNNNDNNNNDNNNNK.", ".KKKKKKKKKKKKKKKKKKKKKK."], "zaru": ["........................", "........K........Gg.....", ".......KyK.....KKK......", ".......KYYK...KPPK......", ".....gGKYYK..KPPPK......", "...KKKKKYYYKGKPPPK......", "..KmMMMKKKKRRKKPPKgK....", "..KMMMMKKKRWRRKPKoOOK...", "..KMMMMKKRRRRRRKoOOOOK..", "..KMMMMKKRRRRRRKOOOOOK..", "..KMMMqK.KRRRRKKOOOOuK..", "...KKKKKKKKKKKKKKKOuK...", "...KKKnnNnnnNnnnNnKKK...", ".KKnnnNnnnNnnnNnnnNnnKK.", ".KnnNnnnNnnnNnnnNnnnNnK.", ".KKnnnNnnnNnnnNnnnNnnKK.", "...KKKnnNnnnNnnnNnKKK...", "......KKKKKKKKKKKK......"], "bag": ["......................", "...........KKK........", "...KK......KGK........", "...KyK....KGGK....KK..", "...KYYK...KGGK..KKPK..", "...KYYK..GKGGK..KPPK..", "...KYYYKKKKGGK.KPPPK..", "....KYKrWRRKGK.KPPPK..", "..KKLKKRRRRKK..KPPK...", "..KLLLKRRRRKK..KPKK...", ".KLLLLLKRRqK...KK.....", "..KKKKKKKKKKKKKKKKKK..", "..KnnnnnnnnnnnnnnnnK..", "..KnnnnnnnnnnnnnnnnK..", "..KnnnKKKKKKKKKKnnK...", "...KnnKWWWWWWWWKnnK...", "...KnnKWGGRRYYWKnNK...", "...KnnKWWWWWWWWKNNK...", "...KnnKKKKKKKKKKNNK...", "...KnnnnnnnnnnNNNNK...", "...KKKKKKKKKKKKKKKK...", "......................"]};
  function sprite(key, scale) {
    const rows = SPRITES[key], w = rows[0].length, h = rows.length;
    let r = '';
    rows.forEach((row, y) => { for (let x = 0; x < w;) { const c = row[x]; let n = 1; while (x + n < w && row[x + n] === c) n++; if (c !== '.') r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${PAL[c]}"/>`; x += n; } });
    return `<svg width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
  }
  document.getElementById('pins').innerHTML = [
    ['A', 'crate', '木箱に盛り合わせ', 'いちばん中身が多く、カラフル。キャベツ・トマト・なす・とうもろこし・青菜・みかん'],
    ['B', 'zaru', 'ざるに盛り合わせ', '丸くてかわいい。りんご・トマト・みかん・なす・とうもろこし'],
    ['C', 'bag', 'マルシェ袋から飛び出す', '「マルシェ」の名前に合う。袋のラベルは3色']
  ].map(([k, key, t, d]) => `<section class="opt"><h3>${k}　${t}</h3><p class="note-s">${d}</p><div class="ground"><figure>${sprite(key, 1.6)}地図での大きさ</figure><figure>${sprite(key, 4)}拡大</figure></div></section>`).join('');
  const fonts = [["ア", "Mochiy Pop One", "丸くて太い。いちばんポップ"], ["イ", "RocknRoll One", "少し角ばった元気な感じ"], ["ウ", "Dela Gothic One", "どっしり太い。看板っぽい"], ["エ", "M PLUS Rounded 1c", "丸ゴシックの太字。おとなしめで読みやすい"], ["オ", "システムフォント（今のまま）", "比べるための今の見た目"]];
  document.getElementById('titles').innerHTML = fonts.map(([k, name, d]) => `<section class="opt"><h3>${k}　${name}</h3><p class="note-s">${d}</p>
    <div class="mock-top"><header class="top"><div class="top-row"><h1${k === 'オ' ? '' : ` style="font-family:'${name}',var(--font)"`}>道のマルシェMAP<small>大泉学園版</small></h1><button class="btn btn-secondary btn-small" type="button">一覧</button></div></header></div></section>`).join('');
</script>
</body>
</html>
