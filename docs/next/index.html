<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3EBDD">
<title>大泉学園無人販売所</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script>window.APP_V = "202610222300"; window.APP_BASE = "../";</script>
<link rel="stylesheet" href="../style.css?v=202610222300">
<script>
  // 普段はファミコン本体風。?theme=simple のときだけシンプルな見た目
  if ((window.APP_THEME || new URLSearchParams(location.search).get('theme') || 'fami') === 'fami') document.documentElement.classList.add('retro', 't-fami');
</script>
<link rel="stylesheet" href="../themes.css?v=202610222300">
<style>
  .maplibregl-map { font-family: var(--font); }
  .lbl { transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <h1>大泉学園無人販売所</h1>
      <button class="btn btn-secondary btn-small" id="listBtn" type="button">一覧</button>
    </div>
  </header>
  <div class="map-wrap">
    <div id="map" aria-label="大泉周辺の地図"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="legend" aria-hidden="true"><span><i class="pin-dot"></i>無人販売所</span><span><i class="pin-dot other"></i>直売所</span></div>
    <div class="layer-panel" id="layerPanel" hidden></div>
    <div class="controls">
      <button class="btn btn-secondary btn-round" id="layerBtn" type="button" aria-expanded="false" aria-label="地図に出す情報"></button>
      <button class="btn btn-secondary btn-round" id="compBtn" type="button" aria-pressed="false" aria-label="向きを表示"></button>
      <button class="btn btn-secondary btn-round" id="locBtn" type="button" aria-pressed="false" aria-label="現在地"></button>
    </div>
    <div class="near-card" id="nearCard" hidden></div>
    <div class="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ／ <a href="https://www.city.nerima.tokyo.jp/kankomoyoshi/nogyo/tokei/sasshi/hureai-guide.html" target="_blank" rel="noopener">練馬区ふれあいガイド</a></div>
  </div>
  <section class="sheet" id="sheet" hidden aria-live="polite"></section>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../themes.js?v=202610222300"></script>
<script src="../common.js?v=202610222300"></script>
<script src="../layers.js?v=202610222300"></script>
<script src="map.js?v=202610222300"></script>
</body>
</html>
