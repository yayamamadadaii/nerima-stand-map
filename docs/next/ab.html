<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>絵地図の端の消え方 見比べ</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* 見比べ用の仮ページ。決まったら消す */
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  .ab { display: flex; flex-direction: column; height: 100%; }
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .pane + .pane { border-top: 1px solid var(--line); }
  .pane h2 { margin: 0; padding: 4px 12px; font-size: var(--fs-small); font-weight: 600; background: var(--surface); border-bottom: 1px solid var(--line); }
  .pane h2 span { font-weight: 400; color: var(--text-sub); }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="ab">
  <section class="pane">
    <h2>① なめらかに薄くなる <span>境界から外へ約120mで消える</span></h2>
    <iframe src="./?art=a" allow="geolocation" title="① なめらかに薄くなる"></iframe>
  </section>
  <section class="pane">
    <h2>② ドットがまばらに消える <span>境界から外へ約120mで消える</span></h2>
    <iframe src="./?art=b" allow="geolocation" title="② ドットがまばらに消える"></iframe>
  </section>
</div>
</body>
</html>
