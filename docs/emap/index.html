<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3EBDD">
<title>絵地図の見本</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* 絵地図のタッチを見比べる見本（決まったら消す）。大泉学園町2〜3丁目のあたりだけ */
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #F4EEDC; color: #1A1A1A; overflow: hidden;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .top {
    background: #F3EBDD; border-bottom: 6px solid #9E1B22; display: flex; flex-direction: column; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  }
  h1 { margin: 0; font-size: 17px; color: #9E1B22; }
  .seg { display: flex; background: #9E1B22; border-radius: 4px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; height: 32px; border: 0; border-radius: 2px; background: transparent; color: #F3EBDD;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #D4A944; color: #1A1A1A; }
  .note { margin: 0; font-size: 13px; color: #4A4038; min-height: 2.6em; }
  #map { flex: 1; min-height: 0; }
  .pin { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .pin svg { display: block; }
  .lbl {
    white-space: nowrap; font-size: 13px; font-weight: 700; color: #1A1A1A; transform: translate(-50%, -50%); width: max-content;
    text-shadow: -1px -1px 0 #FFFDF5, 1px -1px 0 #FFFDF5, -1px 1px 0 #FFFDF5, 1px 1px 0 #FFFDF5, 0 0 3px #FFFDF5;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>絵地図のタッチ 見本</h1>
    <div class="seg" role="group" aria-label="タッチ">
      <button type="button" data-v="now" aria-pressed="false">今</button>
      <button type="button" data-v="a" aria-pressed="true">A ドット絵</button>
      <button type="button" data-v="b" aria-pressed="false">B 手描き風</button>
      <button type="button" data-v="c" aria-pressed="false">C フラット</button>
    </div>
    <p class="note" id="note"></p>
  </header>
  <div id="map" aria-label="見本の地図"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async () => {
  const D = await (await fetch('data.json')).json();
  const ll = (p) => [p[1], p[0]];
  const lines = (list) => ({ type: 'FeatureCollection', features: list.map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c.map(ll) } })) });
  const polys = (list) => ({ type: 'FeatureCollection', features: list.filter(c => c.length > 3).map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) });
  const bld = { type: 'FeatureCollection', features: D.buildings.filter(b => b[1].length > 3).map(([k, c]) => ({ type: 'Feature', properties: { k }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) };
  const pts = (list) => ({ type: 'FeatureCollection', features: list.map(p => ({ type: 'Feature', properties: p.props || {}, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } })) });

  // 公園の中に木を置く場所（毎回同じになるよう決まった乱数で）
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const inside = (p, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [yi, xi] = r[i], [yj, xj] = r[j]; if ((yi > p[0]) !== (yj > p[0]) && p[1] < (xj - xi) * (p[0] - yi) / (yj - yi) + xi) c = !c; } return c; };
  const trees = [];
  for (const r of D.park) {
    const la = r.map(p => p[0]), lo = r.map(p => p[1]);
    const s = Math.min(...la), n = Math.max(...la), w = Math.min(...lo), e = Math.max(...lo);
    const area = (n - s) * 111000 * (e - w) * 90000, want = Math.min(40, Math.max(1, Math.floor(area / 350)));
    for (let i = 0, t = 0; i < want && t < want * 10; t++) { const p = [s + (n - s) * rnd(), w + (e - w) * rnd()]; if (inside(p, r)) { trees.push({ lat: p[0], lng: p[1], props: { v: Math.floor(rnd() * 3) } }); i++; } }
  }
  // 目印の種類 → 絵の種類
  const ICON_OF = { school: 'school', kinder: 'school', post: 'post', police: 'police', fire: 'police', public: 'public', shrine: 'shrine', park: 'park', conv: 'shop', super: 'shop', drug: 'drug', variety: 'shop', food: 'food', bank: 'bank', fuel: 'fuel' };
  const pois = D.pois.filter(p => ICON_OF[p[2]] && p[2] !== 'park').map(p => ({ lat: p[0], lng: p[1], props: { i: ICON_OF[p[2]] } }));

  // ---------- 絵を描く（キャンバスで作って地図に渡す） ----------
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
  const toImg = (c) => ({ width: c.width, height: c.height, data: new Uint8Array(c.getContext('2d').getImageData(0, 0, c.width, c.height).data.buffer) });
  function px(rows, pal, scale) {   // ドット絵
    const [c, g] = canvas(rows[0].length * scale, rows.length * scale);
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x * scale, y * scale, scale, scale); } }));
    return c;
  }
  // 地図記号に近い字を丸の中に描く
  const GLYPH = { school: '文', post: '〒', police: '✕', public: '公', shrine: '⛩', shop: '店', drug: '薬', food: '食', bank: '¥', fuel: 'G' };
  function badge(i, opt) {
    const s = opt.size, [c, g] = canvas(s, s);
    g.fillStyle = opt.bg(i); g.strokeStyle = opt.ring; g.lineWidth = opt.lw;
    if (opt.square) { g.fillRect(opt.lw, opt.lw, s - 2 * opt.lw, s - 2 * opt.lw); g.strokeRect(opt.lw / 2, opt.lw / 2, s - opt.lw, s - opt.lw); }
    else { g.beginPath(); g.arc(s / 2, s / 2, s / 2 - opt.lw, 0, Math.PI * 2); g.fill(); g.stroke(); }
    if (i === 'shrine') {   // 鳥居
      g.strokeStyle = opt.fg; g.lineWidth = s * 0.08; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(s * 0.24, s * 0.32); g.lineTo(s * 0.76, s * 0.32); g.moveTo(s * 0.3, s * 0.44); g.lineTo(s * 0.7, s * 0.44);
      g.moveTo(s * 0.36, s * 0.32); g.lineTo(s * 0.36, s * 0.74); g.moveTo(s * 0.64, s * 0.32); g.lineTo(s * 0.64, s * 0.74); g.stroke();
    } else {
      g.fillStyle = opt.fg; g.font = `${opt.weight} ${Math.round(s * 0.52)}px ${opt.font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(GLYPH[i], s / 2, s / 2 + s * 0.03);
    }
    return c;
  }
  function pattern(size, bg, draw) { const [c, g] = canvas(size, size); g.fillStyle = bg; g.fillRect(0, 0, size, size); draw(g, size); return c; }

  // ---------- 3つのタッチ ----------
  const V = {
    now: {
      note: '今の地図。比べるための基準です。',
      bg: '#EFE6D2', farm: '#D6DDA8', park: '#C3D99B', water: '#9CC4E4', road: '#FFFDF5', casing: '#CDBB98', major: '#B39B70', lane: '#FFFDF5', path: '#CDBB98',
      bld: null, trees: false, icons: false
    },
    a: {
      note: 'ドット絵。畑は作物の列、公園はドットの木、建物は黒いふちのブロック。目印は地図記号のドット。ピンやキャラと絵柄がそろいます。',
      bg: '#E8DCB8', water: '#5BA4E6', road: '#F8F0D8', casing: '#7A5A3A', major: '#5A3A1A', lane: '#F8F0D8', path: '#7A5A3A',
      farmImg: () => pattern(8, '#9CCB5A', (g) => { g.fillStyle = '#5A9A2A'; for (const y of [1, 5]) for (let x = 0; x < 8; x += 4) g.fillRect(x + (y === 5 ? 2 : 0), y, 2, 2); }),
      parkImg: () => pattern(8, '#7CC05A', (g) => { g.fillStyle = '#4F9A3A'; g.fillRect(1, 1, 3, 3); g.fillRect(5, 5, 2, 2); }),
      waterImg: () => pattern(8, '#5BA4E6', (g) => { g.fillStyle = '#CFEAF5'; g.fillRect(1, 2, 3, 1); g.fillRect(5, 6, 2, 1); }),
      pixelRatio: 0.5,
      bld: { house: '#F2A65A', apt: '#9CC4E4', pub: '#E46A6A', com: '#F8D040', other: '#D9C6A0', line: '#3A2A1A', lw: 1.5 },
      trees: true, tree: (v) => px(['..KKKK..', '.KLLGGK.', 'KLLGGGGK', 'KLGGGGGK', 'KGGGGGGK', '.KGGGGK.', '..KBBK..', '...BB...'],
        { K: '#3A2A1A', L: ['#9AE06A', '#8FD45A', '#7CC05A'][v], G: '#4CAF3A', B: '#7C4A1E' }, 3),
      icon: (i) => badge(i, { size: 30, bg: () => '#FFFDF5', ring: '#3A2A1A', lw: 3, fg: '#3A2A1A', square: true, weight: 900, font: 'monospace' }),
      iconPR: 1.4
    },
    b: {
      note: '手描き風。色鉛筆で塗ったようなやわらかい色。建物はうす茶の線を少しずらして2回なぞり、手で描いたような揺れを出しています。木は丸い水彩の木。',
      bg: '#F6EEDC', water: '#B9DAF0', road: '#FFFDF7', casing: '#C9B590', major: '#A88E62', lane: '#FFFDF7', path: '#C9B590',
      farmImg: () => pattern(24, '#E3E7B8', (g) => { g.strokeStyle = 'rgba(120,150,60,0.55)'; g.lineWidth = 2; g.lineCap = 'round'; for (let y = 4; y < 24; y += 8) { g.beginPath(); g.moveTo(1, y); g.bezierCurveTo(8, y - 2, 16, y + 2, 23, y); g.stroke(); } }),
      parkImg: () => pattern(24, '#D3E6B5', (g) => { g.fillStyle = 'rgba(110,160,80,0.25)'; for (const [x, y, r] of [[5, 6, 4], [16, 14, 5], [9, 19, 3]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } }),
      waterImg: () => pattern(24, '#B9DAF0', (g) => { g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1.5; for (const y of [7, 17]) { g.beginPath(); g.moveTo(2, y); g.quadraticCurveTo(7, y - 3, 12, y); g.quadraticCurveTo(17, y + 3, 22, y); g.stroke(); } }),
      pixelRatio: 2,
      bld: { house: '#F4DCC0', apt: '#DCE6EE', pub: '#F0CFC8', com: '#F4E6B4', other: '#EADFCB', line: '#9A7A5A', lw: 1, sketch: true },
      trees: true, tree: (v) => { const [c, g] = canvas(44, 52); const col = ['#7FB55A', '#94C46A', '#6FA84E'][v];
        g.fillStyle = '#8A6A44'; g.fillRect(19, 30, 6, 18);
        g.fillStyle = col; for (const [x, y, r] of [[22, 20, 15], [13, 25, 10], [31, 25, 10]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
        g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(17, 14, 5, 0, 7); g.fill();
        g.strokeStyle = 'rgba(70,90,40,0.6)'; g.lineWidth = 1.5; g.beginPath(); g.arc(22, 20, 15, 3.6, 5.9); g.stroke(); return c; },
      icon: (i) => badge(i, { size: 60, bg: () => '#FFFDF5', ring: '#9A7A5A', lw: 4, fg: '#6A4A2A', weight: 700, font: '"Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif' }),
      iconPR: 2.6
    },
    c: {
      note: 'フラットなイラスト（観光マップ風）。建物は種類ごとに色を変え、下に少しずらした濃い色で厚みを出しています。木はまるい木、目印は色付きの丸いマーク。',
      bg: '#F3EEE2', water: '#8CC8EE', road: '#FFFFFF', casing: '#D8D2C4', major: '#C4BBA8', lane: '#FFFFFF', path: '#D8D2C4',
      farmImg: () => pattern(16, '#CFE3A0', (g) => { g.fillStyle = '#B5D47E'; g.fillRect(0, 0, 16, 5); g.fillRect(0, 8, 16, 5); }),
      parkImg: () => pattern(16, '#BFE0A0', () => {}),
      waterImg: () => pattern(16, '#8CC8EE', () => {}),
      pixelRatio: 2,
      bld: { house: '#FBD9B0', apt: '#C9DEF5', pub: '#F7C1C1', com: '#FBE59A', other: '#EAE2D2', line: '#FFFFFF', lw: 1, depth: { house: '#E3B582', apt: '#9CBADF', pub: '#E39A9A', com: '#E8C860', other: '#CFC4AE' } },
      trees: true, tree: (v) => { const [c, g] = canvas(36, 48); const col = ['#5DBB63', '#4CAF50', '#7CC870'][v];
        g.fillStyle = '#8D6E4E'; g.fillRect(16, 26, 4, 18); g.fillStyle = col; g.beginPath(); g.arc(18, 17, 14, 0, 7); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(13, 12, 4, 0, 7); g.fill(); return c; },
      icon: (i) => badge(i, { size: 56, bg: (k) => ({ school: '#5B8DEF', post: '#E5533D', police: '#3D5A99', public: '#7A8CA8', shrine: '#D9534F', shop: '#F0A030', drug: '#3CB4A0', food: '#E7743C', bank: '#6A7FB0', fuel: '#5A6A7A' })[k] || '#888',
        ring: '#FFFFFF', lw: 4, fg: '#FFFFFF', weight: 700, font: '"Hiragino Sans", sans-serif' }),
      iconPR: 2.4
    }
  };

  function style(v) {
    const S = V[v], B = S.bld;
    const src = {
      farm: polys(D.farm), park: polys(D.park), water: polys(D.water), river: lines(D.river),
      minor: lines(D.minor), mid: lines(D.mid), major: lines(D.major.concat(D.motorway)), lane: lines(D.lane), path: lines(D.path),
      bld, trees: pts(trees), pois: pts(pois)
    };
    const w = (a, b) => ['interpolate', ['linear'], ['zoom'], 14, a, 18, b];
    const L = [{ id: 'bg', type: 'background', paint: { 'background-color': S.bg } }];
    const fill = (id, img, col) => L.push({ id, type: 'fill', source: id, paint: img ? { 'fill-pattern': img } : { 'fill-color': col } });
    fill('farm', S.farmImg && v + '-farm', V.now.farm); fill('park', S.parkImg && v + '-park', V.now.park); fill('water', S.waterImg && v + '-water', S.water);
    L.push({ id: 'river', type: 'line', source: 'river', paint: { 'line-color': S.water, 'line-width': w(2, 6) } });
    const kcol = (m) => ['match', ['get', 'k'], 'house', m.house, 'apt', m.apt, 'pub', m.pub, 'com', m.com, m.other];
    if (B && B.depth) L.push({ id: 'bld-depth', type: 'fill', source: 'bld', minzoom: 15, paint: { 'fill-color': kcol(B.depth), 'fill-translate': [0, 2.5] } });
    if (B) L.push({ id: 'bld', type: 'fill', source: 'bld', minzoom: 15, paint: { 'fill-color': kcol(B) } });
    if (B) L.push({ id: 'bld-line', type: 'line', source: 'bld', minzoom: 15, paint: { 'line-color': B.line, 'line-width': B.lw } });
    if (B && B.sketch) L.push({ id: 'bld-line2', type: 'line', source: 'bld', minzoom: 15.5, paint: { 'line-color': B.line, 'line-width': 0.7, 'line-opacity': 0.55, 'line-translate': [1.2, 0.8] } });
    const R = { 'line-cap': 'round', 'line-join': 'round' };
    L.push({ id: 'path', type: 'line', source: 'path', paint: { 'line-color': S.path, 'line-width': w(1, 2), 'line-dasharray': [2, 3] } });
    L.push({ id: 'lane', type: 'line', source: 'lane', layout: R, paint: { 'line-color': S.lane, 'line-width': w(1.2, 5) } });
    for (const [id, a, b, cc] of [['minor', 3, 11, 'casing'], ['mid', 5, 13, 'casing'], ['major', 7, 19, 'major']]) L.push({ id: id + '-c', type: 'line', source: id, layout: R, paint: { 'line-color': S[cc], 'line-width': w(a, b) } });
    for (const [id, a, b] of [['minor', 1.5, 9.5], ['mid', 3.5, 11.5], ['major', 5, 17]]) L.push({ id, type: 'line', source: id, layout: R, paint: { 'line-color': S.road, 'line-width': w(a, b) } });
    if (S.trees) L.push({ id: 'trees', type: 'symbol', source: 'trees', minzoom: 14.5, layout: { 'icon-image': ['concat', v + '-tree', ['to-string', ['get', 'v']]], 'icon-allow-overlap': true, 'icon-size': w(0.55, 1.1), 'icon-anchor': 'bottom' } });
    if (S.icon) L.push({ id: 'pois', type: 'symbol', source: 'pois', minzoom: 15, layout: { 'icon-image': ['concat', v + '-i-', ['get', 'i']], 'icon-size': w(0.75, 1.05), 'icon-padding': 4 } });
    return { version: 8, sources: Object.fromEntries(Object.entries(src).map(([k, d]) => [k, { type: 'geojson', data: d }])), layers: L };
  }

  const [S0, W0, N0, E0] = D.bbox;
  const map = new maplibregl.Map({
    container: 'map', style: style('a'), center: [(W0 + E0) / 2, (S0 + N0) / 2], zoom: 16, minZoom: 14.8, maxZoom: 18.5,
    maxBounds: [[W0 - 0.004, S0 - 0.003], [E0 + 0.004, N0 + 0.003]], attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false
  });
  map.touchZoomRotate.disableRotation();
  // 絵は、地図が求めたときに作って渡す
  map.on('styleimagemissing', (e) => {
    const cut = e.id.indexOf('-'), v = e.id.slice(0, cut), kind = e.id.slice(cut + 1);
    const S = V[v]; if (!S || cut < 0) return;
    let c, pr = S.pixelRatio || 1;
    if (kind === 'farm') c = S.farmImg(); else if (kind === 'park') c = S.parkImg(); else if (kind === 'water') c = S.waterImg();
    else if (kind.startsWith('tree')) { c = S.tree(+kind.slice(4)); pr = v === 'a' ? 1 : 2; }
    else if (kind.startsWith('i-')) { c = S.icon(kind.slice(2)); pr = S.iconPR; }
    if (c && !map.hasImage(e.id)) map.addImage(e.id, toImg(c), { pixelRatio: pr });
  });

  // 販売所のピン（今のドット絵）
  const PAL = { K: '#3A2A1A', W: '#FFFDF5', R: '#E43B44', O: '#F7962F', G: '#4CAF3A', L: '#8FD45A', B: '#6B3A1A', N: '#C98A4A', S: '#FCD8A8', U: '#2F6FD8', T: '#D9A55B' };
  const SPR = {
    basket: ['....G..L........', '...KRKKOK...KKKK', '..KRRRKOOK..KWWK', '..KRWRKOOOK.KWKK', '.KLLRRKOOOGKKWWK', '.KLLLLGGGGGK.KK.', 'KKKKKKKKKKKKK.K.', 'KTNTNTNTNTNTK.K.', 'KNTNTNTNTNTNK.K.', '.KTNTNTNTNTK..K.', '.KNTNTNTNTNK..K.', '..KKKKKKKKK..KKK'],
    tent: ['...KKKKKKKKKK...', '..KRRWWRRWWRRK..', '.KRRWWRRWWRRWWK.', 'KRRWWRRWWRRWWRRK', 'KKKKKKKKKKKKKKKK', '.K....BBBB....K.', '.K...BSSSSB...K.', '.K...SKSSKS...K.', '.K....SKKS....K.', '.KRR.UUUUUU.LL.K', 'KKKKKKKKKKKKKKKK', 'KNNNNNNNNNNNNNNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KK..........KK.']
  };
  for (const s of D.stands) {
    const el = document.createElement('div'); el.className = 'pin';
    const c = px(SPR[s.unmanned ? 'basket' : 'tent'], PAL, 1); c.style.width = c.width * 2.25 + 'px'; c.style.imageRendering = 'pixelated';
    el.append(c); new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
  }

  const note = document.getElementById('note');
  function show(v) {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    note.textContent = V[v].note;
    map.setStyle(style(v));
  }
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => show(b.dataset.v));
  note.textContent = V.a.note;
})();
</script>
</body>
</html>
