<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3EBDD">
<title>絵地図の見本</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* 絵地図の見本（決まったら消す）。大泉学園駅〜大泉学園町2丁目のあたりだけ。
     ① 建物を地図に描き込む / ② AI で描いた絵地図を地図に重ねる */
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #F4EEDC; color: #1A1A1A; overflow: hidden;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .top {
    background: #F3EBDD; border-bottom: 6px solid #9E1B22; display: flex; flex-direction: column; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  }
  h1 { margin: 0; font-size: 17px; color: #9E1B22; }
  .seg { display: flex; background: #9E1B22; border-radius: 4px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; height: 32px; border: 0; border-radius: 2px; background: transparent; color: #F3EBDD;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #D4A944; color: #1A1A1A; }
  .note { margin: 0; font-size: 13px; color: #4A4038; min-height: 2.6em; }
  [hidden] { display: none !important; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4A4038; }
  .slider input { flex: 1; accent-color: #9E1B22; }
  #map { flex: 1; min-height: 0; }
  .dotrow { display: flex; flex-direction: column; gap: 4px; }
  .seg-sm button { height: 28px; font-size: 12px; }
  /* ドット化: 粗く描いた地図をぼかさずに拡大する */
  #map.pixel canvas { image-rendering: pixelated; }
  #dotCanvas { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; }
  .pin { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .pin canvas { display: block; image-rendering: pixelated; }
  .lbl {
    white-space: nowrap; font-size: 14px; font-weight: 700; color: #1A1A1A; width: max-content; transform: translate(-50%, 14px);
    text-shadow: -1px -1px 0 #FFFDF5, 1px -1px 0 #FFFDF5, -1px 1px 0 #FFFDF5, 1px 1px 0 #FFFDF5, 0 0 3px #FFFDF5;
  }
  /* 地図を画像にするとき（AI に渡す元の絵）だけ使う */
  body.render .top, body.render .lbl, body.render .pin { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>絵地図の見本</h1>
    <div class="seg" role="group" aria-label="見本">
      <button type="button" data-v="now" aria-pressed="false">今</button>
      <button type="button" data-v="draw" aria-pressed="false">①</button>
      <button type="button" data-v="dot" aria-pressed="true">①ドット</button>
      <button type="button" data-v="ai" aria-pressed="false">② AIの絵</button>
    </div>
    <p class="note" id="note"></p>
    <div class="dotrow" id="dotRow">
      <div class="seg seg-sm" role="group" aria-label="ドットの粗さ">
        <button type="button" data-px="2">粗さ 2</button><button type="button" data-px="3" aria-pressed="true">3</button><button type="button" data-px="4">4</button>
      </div>
      <div class="seg seg-sm" role="group" aria-label="色">
        <button type="button" data-col="full">色そのまま</button><button type="button" data-col="pal" aria-pressed="true">色を減らす</button><button type="button" data-col="dith">＋網目</button>
      </div>
    </div>
    <label class="slider" id="sliderRow" hidden>絵の濃さ <input id="op" type="range" min="0" max="100" value="90"></label>
  </header>
  <div id="map" aria-label="見本の地図"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('render')) document.body.classList.add('render');
  const [D, B, X] = await Promise.all([fetch('data.json?v=3').then(r => r.json()), fetch('buildings.json?v=1').then(r => r.json()), fetch('extra.json?v=1').then(r => r.json())]);
  let AI = null;
  try { AI = await (await fetch('ai.json?v=' + Date.now())).json(); } catch (e) {}
  const ll = (p) => [p[1], p[0]];
  const lines = (list) => ({ type: 'FeatureCollection', features: list.map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c.map(ll) } })) });
  const polys = (list) => ({ type: 'FeatureCollection', features: list.filter(c => c.length > 3).map((c, i) => ({ type: 'Feature', properties: { n: i % 4 }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) });
  const bld = { type: 'FeatureCollection', features: B.map(([k, s, c]) => ({ type: 'Feature', properties: { k, s }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) };

  // 公園の木（上から見た丸い木。地図に描き込む形）
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const inside = (p, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [yi, xi] = r[i], [yj, xj] = r[j]; if ((yi > p[0]) !== (yj > p[0]) && p[1] < (xj - xi) * (p[0] - yi) / (yj - yi) + xi) c = !c; } return c; };
  const trees = [];
  for (const r of D.park) {
    const la = r.map(p => p[0]), lo = r.map(p => p[1]);
    const s = Math.min(...la), n = Math.max(...la), w = Math.min(...lo), e = Math.max(...lo);
    const area = (n - s) * 111000 * (e - w) * 90000, want = Math.min(80, Math.max(1, Math.floor(area / 120)));
    for (let i = 0, t = 0; i < want && t < want * 10; t++) { const p = [s + (n - s) * rnd(), w + (e - w) * rnd()]; if (inside(p, r)) { trees.push({ type: 'Feature', properties: { r: 0.7 + rnd() * 0.6, v: Math.floor(rnd() * 3) }, geometry: { type: 'Point', coordinates: [p[1], p[0]] } }); i++; } }
  }

  // ---------- ①改: AI の絵に寄せる ----------
  // 家: 建物の位置に、建物の大きさに合わせた正面向きの家の絵を描く（少し大きめにデフォルメ）
  const bpt = (k) => ({ type: 'FeatureCollection', features: X.bpts.filter(b => k(b[4])).map(([la, ln, sz, a, kind, s]) => ({ type: 'Feature', properties: { sz, kind, i: kind === 'house' ? 'h' + (s % 6) : kind === 'apt' ? 'apt' + (s % 2) : 'big' + (s % 3) }, geometry: { type: 'Point', coordinates: [ln, la] } })) });
  const housePts = bpt(k => k === 'house');
  // 大きな建物（学校・マンション・お店・大きな家）は、実際の形のまま屋根の色で描く
  const bigBld = { type: 'FeatureCollection', features: B.map(([k, s, c], i) => [X.bpts[i][4], s, c]).filter(([kind]) => kind !== 'house')
    .map(([kind, s, c]) => ({ type: 'Feature', properties: { kind, s }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) };
  // 庭の木: 家のそばに、ところどころ小さな木（毎回同じ場所に）
  let seed2 = 7; const rnd2 = () => (seed2 = (seed2 * 16807) % 2147483647) / 2147483647;
  const yardTrees = { type: 'FeatureCollection', features: X.bpts.filter(() => rnd2() < 0.45).map(([la, ln, sz]) => { const a = rnd2() * 6.28, d = sz * (0.8 + rnd2() * 0.5);
    return { type: 'Feature', properties: { v: Math.floor(rnd2() * 3), r: 0.5 + rnd2() * 0.4 }, geometry: { type: 'Point', coordinates: [ln + Math.cos(a) * d / 90400, la + Math.sin(a) * d / 111000] } }; }) };
  // 正面から見た小さな家の絵
  function houseImg(roof, wall, door) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d');
    g.lineJoin = 'round'; g.strokeStyle = '#6B4A30'; g.lineWidth = 2.5;
    g.fillStyle = 'rgba(80,60,30,0.18)'; g.beginPath(); g.ellipse(33, 57, 24, 5, 0, 0, 7); g.fill();
    g.fillStyle = wall; g.beginPath(); g.rect(12, 30, 40, 26); g.fill(); g.stroke();
    g.fillStyle = roof; g.beginPath(); g.moveTo(4, 32); g.lineTo(32, 8); g.lineTo(60, 32); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = door; g.fillRect(28, 42, 9, 14); g.strokeRect(28, 42, 9, 14);
    g.fillStyle = '#BFE3F5'; for (const x of [16, 41]) { g.fillRect(x, 36, 8, 8); g.strokeRect(x, 36, 8, 8); }
    return c;
  }
  function aptImg(body, roof) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 72; const g = c.getContext('2d');
    g.strokeStyle = '#6B4A30'; g.lineWidth = 2.5; g.fillStyle = 'rgba(80,60,30,0.18)'; g.beginPath(); g.ellipse(32, 66, 26, 5, 0, 0, 7); g.fill();
    g.fillStyle = body; g.fillRect(8, 10, 48, 54); g.strokeRect(8, 10, 48, 54); g.fillStyle = roof; g.fillRect(6, 6, 52, 7); g.strokeRect(6, 6, 52, 7);
    g.fillStyle = '#BFE3F5'; g.lineWidth = 1.5; for (let y = 18; y < 58; y += 11) for (const x of [14, 28, 42]) { g.fillRect(x, y, 8, 6); g.strokeRect(x, y, 8, 6); }
    return c;
  }
  function bigImg(roof, wall) {
    const c = document.createElement('canvas'); c.width = 80; c.height = 56; const g = c.getContext('2d');
    g.lineJoin = 'round'; g.strokeStyle = '#6B4A30'; g.lineWidth = 2.5; g.fillStyle = 'rgba(80,60,30,0.18)'; g.beginPath(); g.ellipse(40, 50, 34, 5, 0, 0, 7); g.fill();
    g.fillStyle = wall; g.fillRect(8, 22, 64, 26); g.strokeRect(8, 22, 64, 26);
    g.fillStyle = roof; g.beginPath(); g.moveTo(4, 24); g.lineTo(16, 8); g.lineTo(64, 8); g.lineTo(76, 24); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#BFE3F5'; g.lineWidth = 1.5; for (const x of [14, 28, 46, 60]) { g.fillRect(x, 28, 8, 7); g.strokeRect(x, 28, 8, 7); }
    g.fillStyle = '#9C6B48'; g.fillRect(36, 34, 9, 14); g.strokeRect(36, 34, 9, 14);
    return c;
  }
  const HOUSE = {
    h0: () => houseImg('#E2584A', '#FFF6E6', '#9C6B48'), h1: () => houseImg('#3E78C8', '#FFF6E6', '#9C6B48'), h2: () => houseImg('#E88A3A', '#FDF0D8', '#7C5A3A'),
    h3: () => houseImg('#7A5A44', '#FFF6E6', '#5A4030'), h4: () => houseImg('#4E9A58', '#FDF0D8', '#9C6B48'), h5: () => houseImg('#8A8E99', '#FFFFFF', '#6A6E78'),
    apt0: () => aptImg('#F2EDE2', '#9AA0AA'), apt1: () => aptImg('#E6EEF5', '#7A8EA8'),
    big0: () => bigImg('#C9653E', '#FFF2DC'), big1: () => bigImg('#5E86B8', '#F6F2EA'), big2: () => bigImg('#8F7A62', '#FAF0DE')
  };
  // 紙の質感（ざらつき）をうっすら重ねる
  (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 18; } g.putImageData(d, 0, 0);
    const el = document.createElement('div'); el.id = 'paper'; el.style.cssText = `position:absolute;inset:0;pointer-events:none;z-index:2;background-image:url(${c.toDataURL()});mix-blend-mode:multiply;`; window.__paper = el; })();

  // 模様
  function pattern(size, bg, draw) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, size, size); draw(g, size); return c; }
  const toImg = (c) => ({ width: c.width, height: c.height, data: new Uint8Array(c.getContext('2d').getImageData(0, 0, c.width, c.height).data.buffer) });
  const FIELDS = [['#D9E4A8', '#B9CC78'], ['#E6DFA0', '#CFC270'], ['#CFE0A4', '#A9C47A'], ['#E2D8B0', '#C9B888']];
  const PATTERNS = {
    // 畑: 上から見た作物の列（畑ごとに色を変えてパッチワークに）
    ...Object.fromEntries(FIELDS.map(([bg, fg], i) => ['field' + i, () => pattern(16, bg, (g) => { g.fillStyle = fg; for (let y = 1; y < 16; y += 4) g.fillRect(0, y, 16, 1.6); })])),
    water: () => pattern(24, '#A9D2EE', (g) => { g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.4; for (const y of [7, 17]) { g.beginPath(); g.moveTo(2, y); g.quadraticCurveTo(7, y - 3, 12, y); g.quadraticCurveTo(17, y + 3, 22, y); g.stroke(); } }),
    // 上から見た木
    ...Object.fromEntries([['#7DBB5A', '#5E9E42'], ['#8CC866', '#6AA94C'], ['#6FAE54', '#548F3E']].map(([a, b], i) => ['tree' + i, () => { const c = document.createElement('canvas'); c.width = c.height = 40; const g = c.getContext('2d');
      g.fillStyle = b; g.beginPath(); g.arc(21, 22, 16, 0, 7); g.fill(); g.fillStyle = a; g.beginPath(); g.arc(19, 19, 15, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(14, 14, 5, 0, 7); g.fill(); return c; }]))
  };

  // 屋根の色（建物ごとに少しずつ変える）。壁は屋根より濃い色を少し下にずらして厚みにする
  const ROOF = ['#D9826A', '#7F9FC4', '#93B57A', '#B89474', '#E3B26A', '#8FB8B4', '#C9A9A0'];
  const WALL = ['#B5654F', '#5E7FA4', '#73955A', '#977354', '#C3924A', '#6F9894', '#A98980'];
  const colorBy = (arr, apt, pub, com) => ['match', ['get', 'k'], 'apt', apt, 'pub', pub, 'com', com,
    ['match', ['get', 's'], 0, arr[0], 1, arr[1], 2, arr[2], 3, arr[3], 4, arr[4], 5, arr[5], arr[6]]];

  function style(v) {
    if (v === 'draw2') return style2();
    const w = (a, b) => ['interpolate', ['linear'], ['zoom'], 14, a, 18, b];
    const R = { 'line-cap': 'round', 'line-join': 'round' };
    const src = {
      farm: polys(D.farm), park: polys(D.park), water: polys(D.water), river: lines(D.river),
      minor: lines(D.minor.concat(D.lane)), mid: lines(D.mid), major: lines(D.major.concat(D.motorway)), path: lines(D.path), rail: lines(D.rail), bld,
      trees: { type: 'FeatureCollection', features: trees }
    };
    const L = [];
    const plain = v !== 'draw';   // 「今」と、AI の絵の下に敷く地図
    if (plain) {
      L.push({ id: 'bg', type: 'background', paint: { 'background-color': '#EFE6D2' } },
        { id: 'farm', type: 'fill', source: 'farm', paint: { 'fill-color': '#D6DDA8' } }, { id: 'park', type: 'fill', source: 'park', paint: { 'fill-color': '#C3D99B' } },
        { id: 'water', type: 'fill', source: 'water', paint: { 'fill-color': '#9CC4E4' } });
      // AI に渡す元の絵には、建物の形もうすく入れる（家並みを描いてもらうため）
      if (q.has('render')) L.push({ id: 'bld', type: 'fill', source: 'bld', paint: { 'fill-color': '#D9CCB0' } });
    } else {
      L.push({ id: 'bg', type: 'background', paint: { 'background-color': '#F1E7CF' } },
        { id: 'farm', type: 'fill', source: 'farm', paint: { 'fill-pattern': ['concat', 'field', ['to-string', ['get', 'n']]] } },
        { id: 'farm-edge', type: 'line', source: 'farm', paint: { 'line-color': '#9AAE6A', 'line-width': 1 } },
        { id: 'park', type: 'fill', source: 'park', paint: { 'fill-color': '#BFDC9A' } },
        { id: 'water', type: 'fill', source: 'water', paint: { 'fill-pattern': 'water' } });
    }
    L.push({ id: 'river', type: 'line', source: 'river', paint: { 'line-color': plain ? '#9CC4E4' : '#A9D2EE', 'line-width': w(3, 8) } });
    if (!plain) {
      const fade = ['interpolate', ['linear'], ['zoom'], 14.5, 0, 15.2, 1];
      L.push({ id: 'wall', type: 'fill', source: 'bld', minzoom: 14.5, paint: { 'fill-color': colorBy(WALL, '#B0AAA0', '#C5886A', '#CDB56A'), 'fill-translate': [0, 2], 'fill-opacity': fade } });
      L.push({ id: 'roof', type: 'fill', source: 'bld', minzoom: 14.5, paint: { 'fill-color': colorBy(ROOF, '#D8D4CC', '#E5A88A', '#EDD58A'), 'fill-opacity': fade } });
      L.push({ id: 'roof-line', type: 'line', source: 'bld', minzoom: 15.5, paint: { 'line-color': '#7A5A3A', 'line-width': 0.6, 'line-opacity': 0.55 } });
    }
    L.push({ id: 'path', type: 'line', source: 'path', paint: { 'line-color': '#CDBB98', 'line-width': w(1, 2), 'line-dasharray': [2, 3] } });
    for (const [id, a, b, c] of [['minor', 3, 11, '#CDBB98'], ['mid', 5, 14, '#CDBB98'], ['major', 8, 20, '#B39B70']]) L.push({ id: id + '-c', type: 'line', source: id, layout: R, paint: { 'line-color': c, 'line-width': w(a, b) } });
    for (const [id, a, b] of [['minor', 1.5, 9], ['mid', 3.5, 12], ['major', 6, 17]]) L.push({ id, type: 'line', source: id, layout: R, paint: { 'line-color': '#FFFDF5', 'line-width': w(a, b) } });
    L.push({ id: 'rail', type: 'line', source: 'rail', paint: { 'line-color': '#5A4A3A', 'line-width': w(3, 6) } }, { id: 'rail-d', type: 'line', source: 'rail', paint: { 'line-color': '#FFFDF5', 'line-width': w(1.5, 3.5), 'line-dasharray': [2, 2] } });
    if (!plain) L.push({ id: 'trees', type: 'symbol', source: 'trees', minzoom: 14.5, layout: { 'icon-image': ['concat', 'tree', ['to-string', ['get', 'v']]], 'icon-size': ['interpolate', ['linear'], ['zoom'], 14, ['*', ['get', 'r'], 0.35], 18, ['*', ['get', 'r'], 1.2]], 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    // ② AI で描いた絵を、四隅を実際の位置に合わせて重ねる
    if (v === 'ai' && AI) {
      src.ai = { type: 'image', url: AI.url, coordinates: AI.corners };
      L.push({ id: 'ai', type: 'raster', source: 'ai', paint: { 'raster-opacity': +document.getElementById('op').value / 100, 'raster-resampling': 'linear' } });
    }
    return { version: 8, sources: Object.fromEntries(Object.entries(src).map(([k, d]) => [k, k === 'ai' ? d : { type: 'geojson', data: d }])), layers: L };
  }

  // ①改: 庭の緑の地面、クリームの道に茶色のふち、家の絵、校庭、庭の木
  function style2() {
    const w = (a, b) => ['interpolate', ['linear'], ['zoom'], 14, a, 18, b];
    const R = { 'line-cap': 'round', 'line-join': 'round' };
    const src = {
      farm: polys(D.farm), park: polys(D.park), water: polys(D.water), river: lines(D.river),
      minor: lines(D.minor.concat(D.lane)), mid: lines(D.mid), major: lines(D.major.concat(D.motorway)), path: lines(D.path), rail: lines(D.rail),
      school: polys(X.school), sand: polys(X.sand), grass: polys(X.grass), parking: polys(X.parking),
      houses: housePts, big: bigBld, yard: yardTrees, trees: { type: 'FeatureCollection', features: trees }
    };
    // 家の大きさ: 建物の大きさ(m) × 1.7 を、その拡大率での画面の大きさにする（ズームが1上がると2倍）
    const sz = ['min', ['get', 'sz'], 13];   // 家の大きさに上限（大きすぎる家にしない）
    const size = (k) => ['interpolate', ['exponential', 2], ['zoom'], 14, ['*', sz, 1.7 * 16384 / 63520 / k], 19, ['*', sz, 1.7 * 524288 / 63520 / k]];
    const L = [
      { id: 'bg', type: 'background', paint: { 'background-color': '#D7E3A6' } },
      { id: 'farm', type: 'fill', source: 'farm', paint: { 'fill-pattern': ['concat', 'field', ['to-string', ['get', 'n']]] } },
      { id: 'farm-edge', type: 'line', source: 'farm', paint: { 'line-color': '#8FA460', 'line-width': 1 } },
      { id: 'grass', type: 'fill', source: 'grass', paint: { 'fill-color': '#C2DC8E' } },
      { id: 'park', type: 'fill', source: 'park', paint: { 'fill-color': '#B5D682' } },
      { id: 'school', type: 'fill', source: 'school', paint: { 'fill-color': '#E8DDB8' } },
      { id: 'sand', type: 'fill', source: 'sand', paint: { 'fill-color': '#EAD7A8' } },
      { id: 'sand-line', type: 'line', source: 'sand', paint: { 'line-color': '#C9B080', 'line-width': 1 } },
      { id: 'parking', type: 'fill', source: 'parking', paint: { 'fill-color': '#E2DCC8' } },
      { id: 'water', type: 'fill', source: 'water', paint: { 'fill-pattern': 'water' } },
      { id: 'river-c', type: 'line', source: 'river', paint: { 'line-color': '#6B8FB0', 'line-width': w(4.5, 11) } },
      { id: 'river', type: 'line', source: 'river', paint: { 'line-color': '#5FA8E0', 'line-width': w(3, 8.5) } },
      { id: 'path', type: 'line', source: 'path', paint: { 'line-color': '#B89A6A', 'line-width': w(1, 2), 'line-dasharray': [2, 3] } }
    ];
    for (const [id, a, b] of [['minor', 3.5, 12], ['mid', 6, 16], ['major', 9, 22]]) L.push({ id: id + '-c', type: 'line', source: id, layout: R, paint: { 'line-color': '#9C7A52', 'line-width': w(a, b) } });
    for (const [id, a, b] of [['minor', 2, 9.5], ['mid', 4.2, 13], ['major', 7, 18.5]]) L.push({ id, type: 'line', source: id, layout: R, paint: { 'line-color': '#FBF3DC', 'line-width': w(a, b) } });
    L.push({ id: 'rail', type: 'line', source: 'rail', paint: { 'line-color': '#3A2A1A', 'line-width': w(3, 6) } }, { id: 'rail-d', type: 'line', source: 'rail', paint: { 'line-color': '#FFFDF5', 'line-width': w(1.5, 3.5), 'line-dasharray': [2, 2] } });
    const bigRoof = ['match', ['get', 'kind'], 'apt', '#E8E2D6', 'pub', '#EBA98C', 'com', '#F0D78A', ['match', ['%', ['get', 's'], 3], 0, '#D98A6A', 1, '#8FA9CC', '#B89C7C']];
    const bigWall = ['match', ['get', 'kind'], 'apt', '#B8B0A0', 'pub', '#C5826A', 'com', '#CDB062', ['match', ['%', ['get', 's'], 3], 0, '#B5684C', 1, '#6E87AA', '#97795A']];
    L.push({ id: 'big-wall', type: 'fill', source: 'big', paint: { 'fill-color': bigWall, 'fill-translate': [0, 3] } });
    L.push({ id: 'big', type: 'fill', source: 'big', paint: { 'fill-color': bigRoof } });
    L.push({ id: 'big-line', type: 'line', source: 'big', paint: { 'line-color': '#6B4A30', 'line-width': w(0.6, 1.6) } });
    // 家・木は下にあるほど手前（画面の下ほど前に描く）
    L.push({ id: 'yard', type: 'symbol', source: 'yard', minzoom: 15, layout: { 'icon-image': ['concat', 'tree', ['to-string', ['get', 'v']]], 'icon-size': ['interpolate', ['exponential', 2], ['zoom'], 15, ['*', ['get', 'r'], 0.45], 19, ['*', ['get', 'r'], 7]], 'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-z-order': 'viewport-y' } });
    L.push({ id: 'trees', type: 'symbol', source: 'trees', minzoom: 14.5, layout: { 'icon-image': ['concat', 'tree', ['to-string', ['get', 'v']]], 'icon-size': ['interpolate', ['linear'], ['zoom'], 14, ['*', ['get', 'r'], 0.35], 18, ['*', ['get', 'r'], 1.2]], 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    L.push({ id: 'houses', type: 'symbol', source: 'houses', minzoom: 14.6, layout: { 'icon-image': ['get', 'i'], 'icon-size': size(32), 'icon-anchor': 'bottom', 'icon-offset': [0, 12],
      'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-z-order': 'viewport-y' } });
    return { version: 8, sources: Object.fromEntries(Object.entries(src).map(([k, d]) => [k, { type: 'geojson', data: d }])), layers: L };
  }

  const [S0, W0, N0, E0] = D.bbox;
  const render = q.has('render');
  const map = new maplibregl.Map({
    container: 'map', style: style(render ? 'now' : 'draw'), center: [139.5866, 35.7520], zoom: render ? 16.2 : 15.7, minZoom: 14.6, maxZoom: 18.5,
    maxBounds: render ? null : [[W0 - 0.004, S0 - 0.003], [E0 + 0.004, N0 + 0.003]], attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false,
    preserveDrawingBuffer: true
  });
  map.touchZoomRotate.disableRotation();
  map.on('styleimagemissing', (e) => { const f = PATTERNS[e.id] || HOUSE[e.id]; if (f && !map.hasImage(e.id)) map.addImage(e.id, toImg(f()), { pixelRatio: 2 }); });
  if (render) {
    // AI に渡す画像の四隅の位置を記録する
    map.once('idle', () => {
      const c = map.getContainer(), wpx = c.clientWidth, hpx = c.clientHeight;
      const corners = [[0, 0], [wpx, 0], [wpx, hpx], [0, hpx]].map(p => { const g = map.unproject(p); return [+g.lng.toFixed(6), +g.lat.toFixed(6)]; });
      document.title = 'CORNERS ' + JSON.stringify(corners);
    });
    return;
  }

  // 販売所のピン（今のドット絵）と駅名
  const PAL = { K: '#3A2A1A', W: '#FFFDF5', R: '#E43B44', O: '#F7962F', G: '#4CAF3A', L: '#8FD45A', B: '#6B3A1A', N: '#C98A4A', S: '#FCD8A8', U: '#2F6FD8', T: '#D9A55B' };
  const SPR = {
    basket: ['....G..L........', '...KRKKOK...KKKK', '..KRRRKOOK..KWWK', '..KRWRKOOOK.KWKK', '.KLLRRKOOOGKKWWK', '.KLLLLGGGGGK.KK.', 'KKKKKKKKKKKKK.K.', 'KTNTNTNTNTNTK.K.', 'KNTNTNTNTNTNK.K.', '.KTNTNTNTNTK..K.', '.KNTNTNTNTNK..K.', '..KKKKKKKKK..KKK'],
    tent: ['...KKKKKKKKKK...', '..KRRWWRRWWRRK..', '.KRRWWRRWWRRWWK.', 'KRRWWRRWWRRWWRRK', 'KKKKKKKKKKKKKKKK', '.K....BBBB....K.', '.K...BSSSSB...K.', '.K...SKSSKS...K.', '.K....SKKS....K.', '.KRR.UUUUUU.LL.K', 'KKKKKKKKKKKKKKKK', 'KNNNNNNNNNNNNNNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KK..........KK.']
  };
  for (const s of D.stands) {
    const rows = SPR[s.unmanned ? 'basket' : 'tent'], c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d'); rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
    c.style.width = c.width * 2.5 + 'px';
    const el = document.createElement('div'); el.className = 'pin'; el.append(c);
    new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
  }
  for (const s of D.stations) {
    const el = document.createElement('div'); el.className = 'lbl'; el.textContent = s.name + '駅';
    const box = document.createElement('div'); box.append(el);
    new maplibregl.Marker({ element: box }).setLngLat([s.p[1], s.p[0]]).addTo(map);
  }

  // ---------- ①ドット: 地図を粗い解像度で描き、ドットのまま拡大。色数を減らす処理も ----------
  const mapEl = document.getElementById('map');
  let PX = 3, COL = 'pal', dotOn = false;
  // ファミコン風の16色（地図で使う色に合わせて選んだもの）
  const PALETTE = ['#FFFDF5', '#F1E7CF', '#E2CFA0', '#C9A46A', '#9C7A52', '#5A3E26', '#2A1E14',
    '#D6E39A', '#9FCB5A', '#5E9E42', '#2F6B2A', '#A9D2EE', '#4F8FD8', '#D9826A', '#B5503E', '#E3B26A'].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.5) * 36);
  const dc = document.createElement('canvas'); dc.id = 'dotCanvas';
  const dg = dc.getContext('2d', { willReadFrequently: true });
  map.getCanvasContainer().insertBefore(dc, map.getCanvas().nextSibling);   // 地図の上、ピンと文字の下
  const nearest = (r, g, b) => { let best = 0, bd = 1e9; for (let i = 0; i < PALETTE.length; i++) { const p = PALETTE[i], d = (r - p[0]) ** 2 + (g - p[1]) ** 2 + (b - p[2]) ** 2; if (d < bd) { bd = d; best = i; } } return PALETTE[best]; };
  function quantize() {
    if (!dotOn || COL === 'full') { dc.hidden = true; return; }
    const src = map.getCanvas(); dc.hidden = false;
    if (dc.width !== src.width || dc.height !== src.height) { dc.width = src.width; dc.height = src.height; }
    dc.style.width = src.style.width; dc.style.height = src.style.height;
    dg.drawImage(src, 0, 0);
    const im = dg.getImageData(0, 0, dc.width, dc.height), d = im.data, W = dc.width;
    for (let i = 0; i < d.length; i += 4) {
      const t = COL === 'dith' ? BAYER[((i / 4 / W | 0) % 4) * 4 + (i / 4 % W) % 4] : 0;
      const c = nearest(d[i] + t, d[i + 1] + t, d[i + 2] + t); d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
    dg.putImageData(im, 0, 0);
  }
  map.on('render', quantize);
  function setDot(on) {
    dotOn = on;
    mapEl.classList.toggle('pixel', on);
    // 画面の1点を PX×PX のドットにする（例: 3 なら、3×3 の画面の点が1つのドットになる）
    map.setPixelRatio(on ? 1 / PX : (window.devicePixelRatio || 1));
    document.getElementById('dotRow').hidden = !on;
    map.triggerRepaint();
  }
  const pick = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === String(val)));
  document.querySelectorAll('[data-px]').forEach(b => b.onclick = () => { PX = +b.dataset.px; pick('[data-px]', 'px', PX); setDot(true); });
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { COL = b.dataset.col; pick('[data-col]', 'col', COL); map.triggerRepaint(); });

  const NOTES = {
    now: '今の地図。比べるための基準です。',
    dot: '①ドット。① の地図をわざと粗い解像度で描き、ぼかさずに拡大しています。「粗さ」でドットの大きさ、「色」で16色に減らす処理と網目模様（昔のゲーム機風の中間色）を切り替えられます。ピンと駅名はドット化しません。',
    draw2: '①改 AI の絵に寄せて描き込む。建物の位置と大きさに合わせて家の絵を描き、家のすき間は庭の緑、道はクリームに茶色のふち、校庭や運動場も描きました。紙のざらつきをうっすら重ねています。データから自動で描くので軽く、区全体にも広げられます。',
    draw: '① 建物を地図に描き込む。実際の建物の形に屋根の色と少しの厚みを付けて「上から見た家並み」に。畑はパッチワーク、公園は上から見た木。データから自動で描くので区全体にも広げられます。',
    ai: AI ? '② 今の地図の画像を AI に渡して絵地図に描き直し、四隅を実際の位置に合わせて重ねています。「絵の濃さ」を下げると、下の地図とのずれが分かります。' : '② の絵はまだ用意できていません。'
  };
  const note = document.getElementById('note');
  function show(v) {
    document.querySelectorAll('.seg [data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    note.textContent = NOTES[v];
    map.setStyle(style(v === 'dot' ? 'draw' : v));
    setDot(v === 'dot');
    document.getElementById('sliderRow').hidden = v !== 'ai';
    paperOn(v);
  }
  document.querySelectorAll('.seg [data-v]').forEach(b => b.onclick = () => show(b.dataset.v));
  document.getElementById('op').oninput = (e) => { if (map.getLayer('ai')) map.setPaintProperty('ai', 'raster-opacity', +e.target.value / 100); };
  note.textContent = NOTES.dot;
  document.querySelector('.app').style.position = 'relative'; document.getElementById('map').style.position = 'relative'; document.getElementById('map').append(window.__paper);
  const paperOn = (v) => { window.__paper.hidden = v !== 'draw2'; };
  paperOn('dot');
  setDot(true);
})();
</script>
</body>
</html>
