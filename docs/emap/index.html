<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3EBDD">
<title>絵地図の見本</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* 絵地図の見本（決まったら消す）。大泉学園駅〜大泉学園町2丁目のあたりだけ。
     ① 建物を地図に描き込む / ② AI で描いた絵地図を地図に重ねる */
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #F4EEDC; color: #1A1A1A; overflow: hidden;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .top {
    background: #F3EBDD; border-bottom: 6px solid #9E1B22; display: flex; flex-direction: column; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  }
  h1 { margin: 0; font-size: 17px; color: #9E1B22; }
  .seg { display: flex; background: #9E1B22; border-radius: 4px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; height: 32px; border: 0; border-radius: 2px; background: transparent; color: #F3EBDD;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #D4A944; color: #1A1A1A; }
  .note { margin: 0; font-size: 13px; color: #4A4038; min-height: 2.6em; }
  [hidden] { display: none !important; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4A4038; }
  .slider input { flex: 1; accent-color: #9E1B22; }
  #map { flex: 1; min-height: 0; }
  .pin { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .pin canvas { display: block; image-rendering: pixelated; }
  .lbl {
    white-space: nowrap; font-size: 14px; font-weight: 700; color: #1A1A1A; width: max-content; transform: translate(-50%, 14px);
    text-shadow: -1px -1px 0 #FFFDF5, 1px -1px 0 #FFFDF5, -1px 1px 0 #FFFDF5, 1px 1px 0 #FFFDF5, 0 0 3px #FFFDF5;
  }
  /* 地図を画像にするとき（AI に渡す元の絵）だけ使う */
  body.render .top, body.render .lbl, body.render .pin { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>絵地図の見本</h1>
    <div class="seg" role="group" aria-label="見本">
      <button type="button" data-v="now" aria-pressed="false">今</button>
      <button type="button" data-v="draw" aria-pressed="true">① 描き込み</button>
      <button type="button" data-v="ai" aria-pressed="false">② AIの絵</button>
    </div>
    <p class="note" id="note"></p>
    <label class="slider" id="sliderRow" hidden>絵の濃さ <input id="op" type="range" min="0" max="100" value="90"></label>
  </header>
  <div id="map" aria-label="見本の地図"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('render')) document.body.classList.add('render');
  const [D, B] = await Promise.all([fetch('data.json?v=3').then(r => r.json()), fetch('buildings.json?v=1').then(r => r.json())]);
  let AI = null;
  try { AI = await (await fetch('ai.json?v=' + Date.now())).json(); } catch (e) {}
  const ll = (p) => [p[1], p[0]];
  const lines = (list) => ({ type: 'FeatureCollection', features: list.map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c.map(ll) } })) });
  const polys = (list) => ({ type: 'FeatureCollection', features: list.filter(c => c.length > 3).map((c, i) => ({ type: 'Feature', properties: { n: i % 4 }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) });
  const bld = { type: 'FeatureCollection', features: B.map(([k, s, c]) => ({ type: 'Feature', properties: { k, s }, geometry: { type: 'Polygon', coordinates: [c.map(ll)] } })) };

  // 公園の木（上から見た丸い木。地図に描き込む形）
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const inside = (p, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [yi, xi] = r[i], [yj, xj] = r[j]; if ((yi > p[0]) !== (yj > p[0]) && p[1] < (xj - xi) * (p[0] - yi) / (yj - yi) + xi) c = !c; } return c; };
  const trees = [];
  for (const r of D.park) {
    const la = r.map(p => p[0]), lo = r.map(p => p[1]);
    const s = Math.min(...la), n = Math.max(...la), w = Math.min(...lo), e = Math.max(...lo);
    const area = (n - s) * 111000 * (e - w) * 90000, want = Math.min(80, Math.max(1, Math.floor(area / 120)));
    for (let i = 0, t = 0; i < want && t < want * 10; t++) { const p = [s + (n - s) * rnd(), w + (e - w) * rnd()]; if (inside(p, r)) { trees.push({ type: 'Feature', properties: { r: 0.7 + rnd() * 0.6, v: Math.floor(rnd() * 3) }, geometry: { type: 'Point', coordinates: [p[1], p[0]] } }); i++; } }
  }

  // 模様
  function pattern(size, bg, draw) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, size, size); draw(g, size); return c; }
  const toImg = (c) => ({ width: c.width, height: c.height, data: new Uint8Array(c.getContext('2d').getImageData(0, 0, c.width, c.height).data.buffer) });
  const FIELDS = [['#D9E4A8', '#B9CC78'], ['#E6DFA0', '#CFC270'], ['#CFE0A4', '#A9C47A'], ['#E2D8B0', '#C9B888']];
  const PATTERNS = {
    // 畑: 上から見た作物の列（畑ごとに色を変えてパッチワークに）
    ...Object.fromEntries(FIELDS.map(([bg, fg], i) => ['field' + i, () => pattern(16, bg, (g) => { g.fillStyle = fg; for (let y = 1; y < 16; y += 4) g.fillRect(0, y, 16, 1.6); })])),
    water: () => pattern(24, '#A9D2EE', (g) => { g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.4; for (const y of [7, 17]) { g.beginPath(); g.moveTo(2, y); g.quadraticCurveTo(7, y - 3, 12, y); g.quadraticCurveTo(17, y + 3, 22, y); g.stroke(); } }),
    // 上から見た木
    ...Object.fromEntries([['#7DBB5A', '#5E9E42'], ['#8CC866', '#6AA94C'], ['#6FAE54', '#548F3E']].map(([a, b], i) => ['tree' + i, () => { const c = document.createElement('canvas'); c.width = c.height = 40; const g = c.getContext('2d');
      g.fillStyle = b; g.beginPath(); g.arc(21, 22, 16, 0, 7); g.fill(); g.fillStyle = a; g.beginPath(); g.arc(19, 19, 15, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(14, 14, 5, 0, 7); g.fill(); return c; }]))
  };

  // 屋根の色（建物ごとに少しずつ変える）。壁は屋根より濃い色を少し下にずらして厚みにする
  const ROOF = ['#D9826A', '#7F9FC4', '#93B57A', '#B89474', '#E3B26A', '#8FB8B4', '#C9A9A0'];
  const WALL = ['#B5654F', '#5E7FA4', '#73955A', '#977354', '#C3924A', '#6F9894', '#A98980'];
  const colorBy = (arr, apt, pub, com) => ['match', ['get', 'k'], 'apt', apt, 'pub', pub, 'com', com,
    ['match', ['get', 's'], 0, arr[0], 1, arr[1], 2, arr[2], 3, arr[3], 4, arr[4], 5, arr[5], arr[6]]];

  function style(v) {
    const w = (a, b) => ['interpolate', ['linear'], ['zoom'], 14, a, 18, b];
    const R = { 'line-cap': 'round', 'line-join': 'round' };
    const src = {
      farm: polys(D.farm), park: polys(D.park), water: polys(D.water), river: lines(D.river),
      minor: lines(D.minor.concat(D.lane)), mid: lines(D.mid), major: lines(D.major.concat(D.motorway)), path: lines(D.path), rail: lines(D.rail), bld,
      trees: { type: 'FeatureCollection', features: trees }
    };
    const L = [];
    const plain = v !== 'draw';   // 「今」と、AI の絵の下に敷く地図
    if (plain) {
      L.push({ id: 'bg', type: 'background', paint: { 'background-color': '#EFE6D2' } },
        { id: 'farm', type: 'fill', source: 'farm', paint: { 'fill-color': '#D6DDA8' } }, { id: 'park', type: 'fill', source: 'park', paint: { 'fill-color': '#C3D99B' } },
        { id: 'water', type: 'fill', source: 'water', paint: { 'fill-color': '#9CC4E4' } });
      // AI に渡す元の絵には、建物の形もうすく入れる（家並みを描いてもらうため）
      if (q.has('render')) L.push({ id: 'bld', type: 'fill', source: 'bld', paint: { 'fill-color': '#D9CCB0' } });
    } else {
      L.push({ id: 'bg', type: 'background', paint: { 'background-color': '#F1E7CF' } },
        { id: 'farm', type: 'fill', source: 'farm', paint: { 'fill-pattern': ['concat', 'field', ['to-string', ['get', 'n']]] } },
        { id: 'farm-edge', type: 'line', source: 'farm', paint: { 'line-color': '#9AAE6A', 'line-width': 1 } },
        { id: 'park', type: 'fill', source: 'park', paint: { 'fill-color': '#BFDC9A' } },
        { id: 'water', type: 'fill', source: 'water', paint: { 'fill-pattern': 'water' } });
    }
    L.push({ id: 'river', type: 'line', source: 'river', paint: { 'line-color': plain ? '#9CC4E4' : '#A9D2EE', 'line-width': w(3, 8) } });
    if (!plain) {
      const fade = ['interpolate', ['linear'], ['zoom'], 14.5, 0, 15.2, 1];
      L.push({ id: 'wall', type: 'fill', source: 'bld', minzoom: 14.5, paint: { 'fill-color': colorBy(WALL, '#B0AAA0', '#C5886A', '#CDB56A'), 'fill-translate': [0, 2], 'fill-opacity': fade } });
      L.push({ id: 'roof', type: 'fill', source: 'bld', minzoom: 14.5, paint: { 'fill-color': colorBy(ROOF, '#D8D4CC', '#E5A88A', '#EDD58A'), 'fill-opacity': fade } });
      L.push({ id: 'roof-line', type: 'line', source: 'bld', minzoom: 15.5, paint: { 'line-color': '#7A5A3A', 'line-width': 0.6, 'line-opacity': 0.55 } });
    }
    L.push({ id: 'path', type: 'line', source: 'path', paint: { 'line-color': '#CDBB98', 'line-width': w(1, 2), 'line-dasharray': [2, 3] } });
    for (const [id, a, b, c] of [['minor', 3, 11, '#CDBB98'], ['mid', 5, 14, '#CDBB98'], ['major', 8, 20, '#B39B70']]) L.push({ id: id + '-c', type: 'line', source: id, layout: R, paint: { 'line-color': c, 'line-width': w(a, b) } });
    for (const [id, a, b] of [['minor', 1.5, 9], ['mid', 3.5, 12], ['major', 6, 17]]) L.push({ id, type: 'line', source: id, layout: R, paint: { 'line-color': '#FFFDF5', 'line-width': w(a, b) } });
    L.push({ id: 'rail', type: 'line', source: 'rail', paint: { 'line-color': '#5A4A3A', 'line-width': w(3, 6) } }, { id: 'rail-d', type: 'line', source: 'rail', paint: { 'line-color': '#FFFDF5', 'line-width': w(1.5, 3.5), 'line-dasharray': [2, 2] } });
    if (!plain) L.push({ id: 'trees', type: 'symbol', source: 'trees', minzoom: 14.5, layout: { 'icon-image': ['concat', 'tree', ['to-string', ['get', 'v']]], 'icon-size': ['interpolate', ['linear'], ['zoom'], 14, ['*', ['get', 'r'], 0.35], 18, ['*', ['get', 'r'], 1.2]], 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    // ② AI で描いた絵を、四隅を実際の位置に合わせて重ねる
    if (v === 'ai' && AI) {
      src.ai = { type: 'image', url: AI.url, coordinates: AI.corners };
      L.push({ id: 'ai', type: 'raster', source: 'ai', paint: { 'raster-opacity': +document.getElementById('op').value / 100, 'raster-resampling': 'linear' } });
    }
    return { version: 8, sources: Object.fromEntries(Object.entries(src).map(([k, d]) => [k, k === 'ai' ? d : { type: 'geojson', data: d }])), layers: L };
  }

  const [S0, W0, N0, E0] = D.bbox;
  const render = q.has('render');
  const map = new maplibregl.Map({
    container: 'map', style: style(render ? 'now' : 'draw'), center: [139.5866, 35.7520], zoom: render ? 16.2 : 15.7, minZoom: 14.6, maxZoom: 18.5,
    maxBounds: render ? null : [[W0 - 0.004, S0 - 0.003], [E0 + 0.004, N0 + 0.003]], attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false,
    preserveDrawingBuffer: render
  });
  map.touchZoomRotate.disableRotation();
  map.on('styleimagemissing', (e) => { const f = PATTERNS[e.id]; if (f && !map.hasImage(e.id)) map.addImage(e.id, toImg(f()), { pixelRatio: 2 }); });
  if (render) {
    // AI に渡す画像の四隅の位置を記録する
    map.once('idle', () => {
      const c = map.getContainer(), wpx = c.clientWidth, hpx = c.clientHeight;
      const corners = [[0, 0], [wpx, 0], [wpx, hpx], [0, hpx]].map(p => { const g = map.unproject(p); return [+g.lng.toFixed(6), +g.lat.toFixed(6)]; });
      document.title = 'CORNERS ' + JSON.stringify(corners);
    });
    return;
  }

  // 販売所のピン（今のドット絵）と駅名
  const PAL = { K: '#3A2A1A', W: '#FFFDF5', R: '#E43B44', O: '#F7962F', G: '#4CAF3A', L: '#8FD45A', B: '#6B3A1A', N: '#C98A4A', S: '#FCD8A8', U: '#2F6FD8', T: '#D9A55B' };
  const SPR = {
    basket: ['....G..L........', '...KRKKOK...KKKK', '..KRRRKOOK..KWWK', '..KRWRKOOOK.KWKK', '.KLLRRKOOOGKKWWK', '.KLLLLGGGGGK.KK.', 'KKKKKKKKKKKKK.K.', 'KTNTNTNTNTNTK.K.', 'KNTNTNTNTNTNK.K.', '.KTNTNTNTNTK..K.', '.KNTNTNTNTNK..K.', '..KKKKKKKKK..KKK'],
    tent: ['...KKKKKKKKKK...', '..KRRWWRRWWRRK..', '.KRRWWRRWWRRWWK.', 'KRRWWRRWWRRWWRRK', 'KKKKKKKKKKKKKKKK', '.K....BBBB....K.', '.K...BSSSSB...K.', '.K...SKSSKS...K.', '.K....SKKS....K.', '.KRR.UUUUUU.LL.K', 'KKKKKKKKKKKKKKKK', 'KNNNNNNNNNNNNNNK', 'KNNNNNNNNNNNNNNK', '.KN..........NK.', '.KK..........KK.']
  };
  for (const s of D.stands) {
    const rows = SPR[s.unmanned ? 'basket' : 'tent'], c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d'); rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
    c.style.width = c.width * 2.5 + 'px';
    const el = document.createElement('div'); el.className = 'pin'; el.append(c);
    new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
  }
  for (const s of D.stations) {
    const el = document.createElement('div'); el.className = 'lbl'; el.textContent = s.name + '駅';
    const box = document.createElement('div'); box.append(el);
    new maplibregl.Marker({ element: box }).setLngLat([s.p[1], s.p[0]]).addTo(map);
  }

  const NOTES = {
    now: '今の地図。比べるための基準です。',
    draw: '① 建物を地図に描き込む。実際の建物の形に屋根の色と少しの厚みを付けて「上から見た家並み」に。畑はパッチワーク、公園は上から見た木。データから自動で描くので区全体にも広げられます。',
    ai: AI ? '② 今の地図の画像を AI に渡して絵地図に描き直し、四隅を実際の位置に合わせて重ねています。「絵の濃さ」を下げると、下の地図とのずれが分かります。' : '② の絵はまだ用意できていません。'
  };
  const note = document.getElementById('note');
  function show(v) {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    note.textContent = NOTES[v];
    document.getElementById('sliderRow').hidden = v !== 'ai';
    map.setStyle(style(v));
  }
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => show(b.dataset.v));
  document.getElementById('op').oninput = (e) => { if (map.getLayer('ai')) map.setPaintProperty('ai', 'raster-opacity', +e.target.value / 100); };
  note.textContent = NOTES.draw;
})();
</script>
</body>
</html>
