<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: 名前の入力欄を押したとき iPhone が拡大し、戻らずに画面がはみ出したため（2026-10-29） -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2C2C2E" media="(prefers-color-scheme: dark)">
<title>道のマルシェMAP 大泉学園版</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script>window.APP_V = "202610291826"; window.APP_BASE = "../"; window.APP_THEME = "simple";</script>
<script>
  // GitHub Pages はページを最大10分スマホに残すので、新しい版が出ていたら1回だけ読み直す
  fetch((window.APP_BASE || '') + 'version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = v.trim();
    if (!v || v === window.APP_V) return;
    try { if (sessionStorage.getItem('reloadedFor') === v) return; sessionStorage.setItem('reloadedFor', v); } catch (e) { return; }
    location.reload();
  }).catch(() => {});
</script>
<!-- タイトルだけポップな書体（だいき選択 2026-10-26）。使う文字だけ読み込む。タイトルを変えたら text= も直す -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&text=%E9%81%93%E3%81%AE%E3%83%9E%E3%83%AB%E3%82%B7%E3%82%A7MAP%E5%A4%A7%E6%B3%89%E5%AD%A6%E5%9C%92%E7%89%88&display=swap">
<link rel="stylesheet" href="../style.css?v=202610291826">
<script>
  // 普段はファミコン本体風。simple/ のページか ?theme=simple のときだけシンプルな見た目
  if ((window.APP_THEME || new URLSearchParams(location.search).get('theme') || 'fami') === 'fami') document.documentElement.classList.add('retro', 't-fami');
</script>
<link rel="stylesheet" href="../themes.css?v=202610291826">
<style>
  /* 地図は MapLibre GL（2026-10-26 に Leaflet から載せ替え。前の版はタグ v1-leaflet） */
  .maplibregl-map { font-family: var(--font); }
  .lbl { transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <h1>道のマルシェMAP<small>大泉学園版</small></h1>
      <button class="btn btn-secondary btn-small" id="listBtn" type="button">一覧</button>
    </div>
  </header>
  <div class="map-wrap">
    <div id="map" aria-label="大泉周辺の地図"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="layer-panel" id="layerPanel" hidden></div>
    <div class="controls">
      <button class="btn btn-secondary btn-round" id="layerBtn" type="button" aria-expanded="false" aria-label="地図に出す情報"></button>
      <button class="btn btn-secondary btn-round" id="compBtn" type="button" aria-pressed="false" aria-label="向きを表示"></button>
      <button class="btn btn-secondary btn-round" id="locBtn" type="button" aria-pressed="false" aria-label="現在地"></button>
    </div>
    <div class="near-card" id="nearCard" hidden></div>
    <div class="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ／ <a href="https://www.city.nerima.tokyo.jp/kankomoyoshi/nogyo/tokei/sasshi/hureai-guide.html" target="_blank" rel="noopener">練馬区ふれあいガイド</a></div>
  </div>
  <section class="sheet" id="sheet" hidden aria-live="polite"></section>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../themes.js?v=202610291826"></script>
<script src="../common.js?v=202610291826"></script>
<script src="../layers.js?v=202610291826"></script>
<script src="../map.js?v=202610291826"></script>
</body>
</html>
