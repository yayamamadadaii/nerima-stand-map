<title>ねりま無人販売所マップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*LEAFLET_CSS*/
</style>
<style>
/* 全画面の地図。上に見出しとフィルタ、下に詳細シート。--map-* は地図専用の提案値（DESIGN.md 未登録） */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --line: #E5E5EA; --text: #1D1D1F; --text-sub: #6E6E73;
  --accent: #0066CC; --accent-text: #0066CC; --accent-soft: rgba(0, 102, 204, 0.12);
  --radius-card: 18px; --radius-control: 12px; --radius-small: 8px;
  --font: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --fs-caption: 12px; --fs-small: 13px; --fs-body: 15px; --fs-h3: 17px; --fs-h2: 20px;
  --lh-body: 1.6; --lh-heading: 1.4;
  --motion-fast: 150ms ease-out; --motion-base: 220ms ease-out;
  --map-land: #F2F2F7; --map-farm: #E7ECE1; --map-park: #E1EADD; --map-water: #CADDF0;
  --map-road: #FFFFFF; --map-road-casing: #D9D9DE; --map-road-major-casing: #C2C2C8;
  --map-rail: #8E8E93; --map-border: #8E8E93;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1C1E; --surface: #2C2C2E; --line: #3A3A3C; --text: #F5F5F7; --text-sub: #A1A1A6;
    --accent: #0A6CE0; --accent-text: #4DA3FF; --accent-soft: rgba(77, 163, 255, 0.16);
    --map-land: #1C1C1E; --map-farm: #212620; --map-park: #1E2720; --map-water: #1A2C40;
    --map-road: #3A3A3C; --map-road-casing: #2A2A2C; --map-road-major-casing: #2A2A2C;
    --map-rail: #8E8E93; --map-border: #A1A1A6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1C1E; --surface: #2C2C2E; --line: #3A3A3C; --text: #F5F5F7; --text-sub: #A1A1A6;
  --accent: #0A6CE0; --accent-text: #4DA3FF; --accent-soft: rgba(77, 163, 255, 0.16);
  --map-land: #1C1C1E; --map-farm: #212620; --map-park: #1E2720; --map-water: #1A2C40;
  --map-road: #3A3A3C; --map-road-casing: #2A2A2C; --map-road-major-casing: #2A2A2C;
  --map-rail: #8E8E93; --map-border: #A1A1A6;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); overflow: hidden; }
button { font: inherit; color: inherit; }
.app { position: relative; height: 100%; display: flex; flex-direction: column; }

.top {
  position: relative; z-index: 500; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: 8px; padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: var(--fs-h3); font-weight: 600; line-height: var(--lh-heading); }
.seg { display: flex; background: var(--bg); border-radius: var(--radius-control); padding: 4px; gap: 4px; }
.seg button {
  flex: 1; height: 32px; border: 0; border-radius: var(--radius-small); background: transparent;
  color: var(--text-sub); font-size: var(--fs-small); font-weight: 600; cursor: pointer;
  transition: background var(--motion-fast), color var(--motion-fast);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
.seg .num { font-variant-numeric: tabular-nums; font-weight: 400; color: var(--text-sub); margin-left: 4px; }

.btn {
  height: 40px; padding: 0 16px; border-radius: var(--radius-control);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background var(--motion-fast), border-color var(--motion-fast);
}
.btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
.btn-primary:active { filter: brightness(0.92); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn-secondary:active { background: var(--bg); }
.btn-small { height: 32px; padding: 0 12px; font-size: var(--fs-small); }
.btn:focus-visible, .seg button:focus-visible, .row:focus-visible, .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 16px; height: 16px; }

.map-wrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--map-land); }
.leaflet-container { font-family: var(--font); }
.lbl {
  white-space: nowrap; font-size: var(--fs-caption); line-height: 1; color: var(--text-sub);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-small);
  padding: 4px 8px; transform: translate(-50%, -50%); width: max-content; pointer-events: none;
}
.lbl-st { color: var(--text); font-weight: 600; }
.lbl-town { background: transparent; border: 0; padding: 0; font-weight: 600; letter-spacing: 0.01em; }
.credit {
  position: absolute; z-index: 400; left: max(8px, env(safe-area-inset-left, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px));
  right: max(8px, env(safe-area-inset-right, 0px)); width: fit-content;
  font-size: var(--fs-caption); color: var(--text-sub); background: var(--surface);
  padding: 0 8px; border-radius: var(--radius-small); border: 1px solid var(--line);
}
.credit a { color: inherit; }

.sheet {
  position: absolute; z-index: 600; left: 0; right: 0; bottom: 0;
  max-height: 70%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-top: 1px solid var(--line);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stack { display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: var(--fs-h2); font-weight: 600; line-height: var(--lh-heading); text-wrap: balance; }
.sheet-head > div { min-width: 0; }
.close {
  width: 32px; height: 32px; border-radius: var(--radius-small); border: 0; background: var(--bg);
  color: var(--text-sub); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none;
}
.sub { color: var(--text-sub); font-size: var(--fs-small); }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { background: var(--accent-soft); color: var(--accent-text); border-radius: var(--radius-small); padding: 2px 8px; font-size: var(--fs-small); font-weight: 600; }
.tag-plain { background: var(--bg); color: var(--text-sub); }
.note { margin: 0; }
.list { display: flex; flex-direction: column; margin: 0 -16px; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; cursor: pointer; width: 100%;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--bg); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--text-sub); font-size: var(--fs-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-dist { color: var(--text-sub); font-size: var(--fs-small); font-variant-numeric: tabular-nums; flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--accent); }
.dot.other { background: var(--text-sub); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-nav" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="top-row">
      <h1>ねりま無人販売所マップ</h1>
      <button class="btn btn-secondary btn-small" id="listBtn" type="button"><svg class="icon icon-sm"><use href="#i-list"/></svg>一覧</button>
    </div>
    <div class="seg" role="group" aria-label="表示する販売所">
      <button type="button" id="fUnmanned" aria-pressed="true">無人販売機あり<span class="num" id="nUnmanned"></span></button>
      <button type="button" id="fAll" aria-pressed="false">すべての直売所<span class="num" id="nAll"></span></button>
    </div>
  </header>
  <div class="map-wrap">
    <div id="map" aria-label="大泉周辺の地図"></div>
    <div class="credit">地図: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ／ 直売所: <a href="https://www.city.nerima.tokyo.jp/kankomoyoshi/nogyo/tokei/sasshi/hureai-guide.html" target="_blank" rel="noopener">練馬区 ふれあいガイド</a></div>
  </div>
  <section class="sheet" id="sheet" hidden aria-live="polite"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const D = __DATA__;
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // 状態（使う関数より先に宣言する）
  let filter = 'unmanned';
  let selectedNo = null;
  let sheetView = null;
  try { const f = localStorage.getItem('filter'); if (f === 'all' || f === 'unmanned') filter = f; } catch (e) {}

  // ---------- 地図 ----------
  const mainTowns = D.towns.filter(t => t.name !== '西大泉町');
  const ring = mainTowns.flatMap(t => t.rings[0]);
  const area = L.latLngBounds(
    [Math.min(...ring.map(p => p[0])), Math.min(...ring.map(p => p[1]))],
    [Math.max(...ring.map(p => p[0])), Math.max(...ring.map(p => p[1]))]);
  const map = L.map('map', { zoomControl: false, attributionControl: false, maxZoom: 18, zoomSnap: 0.25, zoomDelta: 0.5, maxBounds: area.pad(0.15), maxBoundsViscosity: 1 });
  map.fitBounds(area, { padding: [8, 8] });
  map.setMinZoom(map.getZoom());

  map.createPane('base').style.zIndex = 250;
  map.createPane('mask').style.zIndex = 380;
  map.createPane('labels').style.zIndex = 390;
  const canvas = L.canvas({ pane: 'base', padding: 0.3 });
  const styled = [];
  function add(list, styleFn, poly) {
    const opts = { renderer: canvas, interactive: false, ...styleFn() };
    const lyr = (poly ? L.polygon(list, opts) : L.polyline(list, opts)).addTo(map);
    styled.push([lyr, styleFn]);
  }
  const zw = () => Math.max(0, map.getZoom() - 15);
  const roads = { lineCap: 'round', lineJoin: 'round' };
  const major = D.major.concat(D.motorway);
  add(D.farm.map(r => [r]), () => ({ stroke: false, fillColor: css('--map-farm'), fillOpacity: 1 }), true);
  add(D.park.map(r => [r]), () => ({ stroke: false, fillColor: css('--map-park'), fillOpacity: 1 }), true);
  add(D.water.map(r => [r]), () => ({ stroke: false, fillColor: css('--map-water'), fillOpacity: 1 }), true);
  add(D.river, () => ({ color: css('--map-water'), weight: 2 + zw(), lineCap: 'round' }));
  add(D.minor, () => ({ ...roads, color: css('--map-road-casing'), weight: 3 + zw() * 2 }));
  add(D.mid, () => ({ ...roads, color: css('--map-road-casing'), weight: 5 + zw() * 2 }));
  add(major, () => ({ ...roads, color: css('--map-road-major-casing'), weight: 7 + zw() * 3 }));
  add(D.minor, () => ({ ...roads, color: css('--map-road'), weight: 1.5 + zw() * 2 }));
  add(D.mid, () => ({ ...roads, color: css('--map-road'), weight: 3.5 + zw() * 2 }));
  add(major, () => ({ ...roads, color: css('--map-road'), weight: 5 + zw() * 3 }));
  add(D.rail, () => ({ color: css('--map-rail'), weight: 2 + zw() * 0.5 }));
  add(D.rail, () => ({ color: css('--map-land'), weight: 1 + zw() * 0.5, dashArray: '6 6' }));

  // 大泉5町の外を薄く覆う
  const world = [[35.6, 139.4], [35.6, 139.8], [35.9, 139.8], [35.9, 139.4]];
  const mask = L.polygon([world, ...mainTowns.map(t => t.rings[0])], { pane: 'mask', interactive: false, stroke: false, fillOpacity: 0.72, fillRule: 'evenodd' }).addTo(map);
  const borders = mainTowns.map(t => L.polygon(t.rings, { pane: 'mask', interactive: false, fill: false, weight: 1, dashArray: '4 4', opacity: 0.6 }).addTo(map));

  function label(p, text, cls) {
    const div = document.createElement('div');
    div.className = 'lbl ' + cls;
    div.textContent = text;
    L.marker(p, { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: div, iconSize: [0, 0] }) }).addTo(map);
  }
  for (const s of D.stations) label(s.p, s.name + '駅', 'lbl-st');
  for (const t of mainTowns) label(t.c, t.name, 'lbl-town');

  // ---------- 販売所 ----------
  const stands = D.stands;
  const visible = (s) => filter === 'all' || s.unmanned;
  const markers = new Map();
  for (const s of stands) {
    const m = L.circleMarker([s.lat, s.lng], { bubblingMouseEvents: false });
    m.on('click', () => openDetail(s.no));
    markers.set(s.no, m);
  }
  function dotStyle(s) {
    const sel = s.no === selectedNo;
    return { radius: sel ? 10 : 7, color: css('--surface'), weight: 2, fillOpacity: 1, fillColor: s.unmanned ? css('--accent') : css('--text-sub') };
  }
  function renderDots() {
    for (const s of stands) {
      const m = markers.get(s.no);
      if (visible(s)) { m.setStyle(dotStyle(s)); if (!map.hasLayer(m)) m.addTo(map); if (s.no === selectedNo) m.bringToFront(); }
      else m.remove();
    }
  }
  $('nUnmanned').textContent = stands.filter(s => s.unmanned).length;
  $('nAll').textContent = stands.length;

  function setFilter(f) {
    filter = f;
    try { localStorage.setItem('filter', f); } catch (e) {}
    $('fUnmanned').setAttribute('aria-pressed', f === 'unmanned');
    $('fAll').setAttribute('aria-pressed', f === 'all');
    const sel = stands.find(s => s.no === selectedNo);
    if (sel && !visible(sel)) closeSheet();
    renderDots();
    if (sheetView === 'list') openList();
  }
  $('fUnmanned').onclick = () => setFilter('unmanned');
  $('fAll').onclick = () => setFilter('all');

  function restyle() {
    for (const [lyr, fn] of styled) lyr.setStyle(fn());
    mask.setStyle({ fillColor: css('--map-land') });
    for (const b of borders) b.setStyle({ color: css('--map-border') });
    renderDots();
  }
  map.on('zoomend', () => { for (const [lyr, fn] of styled) lyr.setStyle(fn()); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- シート ----------
  const sheet = $('sheet');
  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
    return e;
  }
  function icon(name, small) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'icon' + (small ? ' icon-sm' : ''));
    const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#i-' + name);
    s.append(u);
    return s;
  }
  function head(title, sub) {
    return el('div', { class: 'sheet-head' },
      el('div', {}, el('h2', {}, title), sub ? el('div', { class: 'sub' }, sub) : null),
      el('button', { class: 'close', type: 'button', 'aria-label': '閉じる', onclick: closeSheet }, icon('x', true)));
  }
  function showSheet(view, ...content) {
    sheetView = view;
    sheet.replaceChildren(el('div', { class: 'stack' }, ...content));
    sheet.hidden = false;
    sheet.scrollTop = 0;
  }
  function closeSheet() {
    sheet.hidden = true; sheetView = null;
    if (selectedNo != null) { selectedNo = null; renderDots(); }
  }
  map.on('click', closeSheet);

  function distM(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(x));
  }
  const fmtDist = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
  const routeUrl = (s) => `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking`;

  function openDetail(no) {
    const s = stands.find(x => x.no === no);
    if (!s) return;
    selectedNo = no; renderDots();
    showSheet('detail',
      head(s.name, s.address),
      el('div', { class: 'meta-line' },
        el('span', { class: s.unmanned ? 'tag' : 'tag tag-plain' }, s.unmanned ? '無人販売機あり' : '直売所'),
        el('span', { class: 'sub' }, `区のガイド No.${s.no}`)),
      s.note ? el('p', { class: 'note' }, s.note) : null,
      el('div', { class: 'stack', style: 'gap:4px' },
        el('div', { class: 'sub' }, '主な品目（時期によって変わります）'),
        el('div', { class: 'tags' }, s.items.map(i => el('span', { class: 'tag tag-plain' }, i)))),
      el('a', { class: 'btn btn-primary', href: routeUrl(s), target: '_blank', rel: 'noopener' }, icon('nav'), 'Googleマップで経路を見る'),
      el('div', { class: 'sub' }, '情報は2025年11月発行の区のガイドより。開いていないこともあります。'));
  }

  function openList() {
    const c = map.getCenter();
    const rows = stands.filter(visible)
      .map(s => ({ s, d: distM({ lat: c.lat, lng: c.lng }, s) }))
      .sort((a, b) => a.d - b.d);
    showSheet('list',
      head(`${rows.length} か所`, '地図の中心から近い順'),
      el('div', { class: 'list' }, rows.map(({ s, d }) =>
        el('button', { class: 'row', type: 'button', onclick: () => { map.setView([s.lat, s.lng], Math.max(map.getZoom(), 16)); openDetail(s.no); } },
          el('span', { class: 'dot' + (s.unmanned ? '' : ' other') }),
          el('span', { class: 'row-main' },
            el('div', { class: 'row-title' }, s.name),
            el('div', { class: 'row-sub' }, `${s.address.replace('練馬区', '')}　${s.items.slice(0, 4).join('・')}`)),
          el('span', { class: 'row-dist' }, fmtDist(d))))));
  }
  $('listBtn').onclick = () => sheetView === 'list' ? closeSheet() : openList();

  restyle();
  setFilter(filter);
})();
</script>
